name = "allamo-pmo-config-guard"
pages_build_output_dir = "public"
compatibility_date = "2026-08-20"

# GUARD DE SEGURANCA
# Este arquivo NAO possui binding D1 nem Workers AI de proposito.
# Deploys e operacoes remotas devem escolher explicitamente:
#   STAGE     -> --config wrangler.stage.toml
#   PRODUCAO  -> --config wrangler.production.toml
#
# Motivo: Cloudflare Pages aceita apenas os ambientes nomeados
# "preview" e "production". Usar [env.stage] faz o Pages rejeitar o deploy.
# Separar os projetos por arquivo evita que o Pages de Stage receba
# acidentalmente o binding D1 da producao (ou vice-versa).
