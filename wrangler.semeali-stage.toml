name = "semeali-intelligence-stage"
pages_build_output_dir = "semeali-dist"
compatibility_date = "2026-08-20"

# Projeto Cloudflare Pages exclusivo da Semeali em STAGE.
# URL canônica esperada: https://semeali-intelligence-stage.pages.dev
# O D1 abaixo é o mesmo banco de Stage já validado, com isolamento lógico pelo tenant `semeali`.

[[d1_databases]]
binding = "DB"
database_name = "allamo-pmo-stage"
database_id = "72e2f6a0-3d22-4d65-a820-4a9b9ea88321"

[ai]
binding = "AI"

[env.production]
compatibility_date = "2026-08-20"

[[env.production.d1_databases]]
binding = "DB"
database_name = "allamo-pmo-stage"
database_id = "72e2f6a0-3d22-4d65-a820-4a9b9ea88321"

[env.production.ai]
binding = "AI"

[env.preview]
compatibility_date = "2026-08-20"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "allamo-pmo-stage"
database_id = "72e2f6a0-3d22-4d65-a820-4a9b9ea88321"

[env.preview.ai]
binding = "AI"
