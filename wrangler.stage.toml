name = "allamo-pmo-stage"
pages_build_output_dir = "public"
compatibility_date = "2026-08-20"

# Configuracao EXCLUSIVA do projeto Cloudflare Pages de STAGE.
# Pages aceita apenas os ambientes nomeados "preview" e "production".
# O ambiente production abaixo e a producao DO PROJETO DE STAGE
# (https://allamo-pmo-stage.pages.dev), nao a producao do Instituto.

[[d1_databases]]
binding = "DB"
database_name = "allamo-pmo-stage"
database_id = "72e2f6a0-3d22-4d65-a820-4a9b9ea88321"

[ai]
binding = "AI"

[env.production]
compatibility_date = "2026-08-20"

[[env.production.d1_databases]]
binding = "DB"
database_name = "allamo-pmo-stage"
database_id = "72e2f6a0-3d22-4d65-a820-4a9b9ea88321"

[env.production.ai]
binding = "AI"

[env.preview]
compatibility_date = "2026-08-20"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "allamo-pmo-stage"
database_id = "72e2f6a0-3d22-4d65-a820-4a9b9ea88321"

[env.preview.ai]
binding = "AI"
