document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rgin-top:64px;max-width:460px\">\n        <div style=\"letter-spacing:.16em;text-transform:uppercase;font-size:12px;font-weight:800;opacity:.75\">PMO · Governança e Consultoria<\u002Fdiv>\n        <h1 style=\"font-size:clamp(30px,3.4vw,46px);line-height:1.06;margin:14px 0 16px;font-weight:900\">Portal de Governança de Projetos<\u002Fh1>\n        <p style=\"opacity:.82;font-size:15.5px;line-height:1.6;margin:0\">Acompanhamento de portfólio, demandas, mudanças (GMUD) e entregas — em um só lugar, com visão dedicada para cada empresa.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:26px;font-size:13px;opacity:.8\">\n      <div><strong style=\"display:block;font-size:22px;font-weight:900\">7<\u002Fstrong>projetos ativos<\u002Fdiv>\n      <div><strong style=\"display:block;font-size:22px;font-weight:900\">14<\u002Fstrong>empresas<\u002Fdiv>\n      <div><strong style=\"display:block;font-size:22px;font-weight:900\">259<\u002Fstrong>demandas monitoradas<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;justify-content:center;padding:48px 6vw\">\n    <div style=\"width:100%;max-width:440px;animation:fadeUp .4s ease\">\n      <h2 style=\"font-size:24px;font-weight:800;margin:0 0 4px\">Entrar no portal<\u002Fh2>\n      <p style=\"color:#64748b;margin:0 0 22px;font-size:14px\">Acesse com e-mail e senha da sua conta.<\u002Fp>\n      <form sc-camel-on-submit=\"{{ onLoginSubmit }}\" style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:22px\">\n        <label style=\"font-size:12.5px;font-weight:700;color:#475467\">E-mail\n          <input sc-camel-on-input=\"{{ onEmail }}\" type=\"email\" value=\"{{ emailVal }}\" placeholder=\"voce@empresa.com.br\" style=\"display:block;width:100%;margin-top:5px;padding:12px 13px;border:1px solid #d0d5dd;border-radius:11px;font-size:14px\">\n        <\u002Flabel>\n        <label style=\"font-size:12.5px;font-weight:700;color:#475467\">Senha\n          <input sc-camel-on-input=\"{{ onPassword }}\" type=\"password\" value=\"{{ passwordVal }}\" placeholder=\"••••••••\" style=\"display:block;width:100%;margin-top:5px;padding:12px 13px;border:1px solid #d0d5dd;border-radius:11px;font-size:14px\">\n        <\u002Flabel>\n        <sc-if value=\"{{ hasLoginError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px;color:#b42318;font-weight:700\">{{ loginError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button type=\"submit\" style=\"margin-top:4px;background:#0f2c4d;color:#fff;border:0;border-radius:11px;padding:13px;font-weight:800;font-size:14px;cursor:pointer\" style-hover=\"background:#153c66\">{{ loginBtnLabel }}<\u002Fbutton>\n      <\u002Fform>\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px\"><span style=\"flex:1;height:1px;background:#e2e8f1\"><\u002Fspan><span style=\"font-size:11.5px;color:#94a3b8;font-weight:700\">ou entre como (demo)<\u002Fspan><span style=\"flex:1;height:1px;background:#e2e8f1\"><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <sc-for list=\"{{ roleCards }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ r.go }}\" style=\"text-align:left;background:#fff;border:1px solid #e2e8f1;border-radius:14px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:15px;transition:all .15s;box-shadow:0 3px 10px rgba(16,35,59,.04)\" style-hover=\"border-color:#2563a8;box-shadow:0 8px 22px rgba(37,99,168,.16);transform:translateY(-1px)\">\n            <span style=\"width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:900;font-size:15px;color:#fff;background:{{ r.color }}\">{{ r.badge }}<\u002Fspan>\n            <span style=\"flex:1\">\n              <span style=\"display:block;font-weight:800;font-size:15px;color:#10233b\">{{ r.name }}<\u002Fspan>\n              <span style=\"display:block;font-size:12.5px;color:#64748b;margin-top:2px\">{{ r.desc }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"color:#94a3b8;font-size:18px\">→<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"color:#94a3b8;font-size:12px;margin-top:22px;line-height:1.5\">Protótipo navegável — nenhum dado é alterado. O login real usará a gestão de acessos deste portal.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n<header style=\"background:linear-gradient(135deg,#0b2340,#13375f 60%,#1c4a7d);color:#fff;padding:16px 3vw;position:sticky;top:0;z-index:20;box-shadow:0 6px 22px rgba(11,35,64,.18)\">\n  <div style=\"max-width:1560px;margin:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n    <div style=\"display:flex;align-items:center;gap:11px\">\n      <div style=\"width:36px;height:36px;border-radius:9px;background:#fff;color:#0f2c4d;display:grid;place-items:center;font-weight:900;font-size:17px\">Á<\u002Fdiv>\n      <div>\n        <div style=\"font-weight:800;font-size:15px;line-height:1.1\">Portal PMO · Államo<\u002Fdiv>\n        <div style=\"font-size:11px;opacity:.72;font-weight:600\">{{ contextLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <sc-if value=\"{{ isInternal }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <span style=\"font-size:11px;opacity:.7;font-weight:700;text-transform:uppercase;letter-spacing:.08em\">Empresa<\u002Fspan>\n        <sc-raw-select sc-camel-on-change=\"{{ onCompanyChange }}\" style=\"background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:8px 11px;font-weight:700;font-size:13px\">\n          <sc-for list=\"{{ companyOptions }}\" as=\"o\" hint-placeholder-count=\"5\">\n            <option value=\"{{ o.id }}\" selected=\"{{ o.sel }}\">{{ o.name }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex;align-items:center;gap:11px;padding-left:6px\">\n      <span style=\"width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800;font-size:13px\">{{ userInitials }}<\u002Fspan>\n      <div style=\"line-height:1.15\">\n        <div style=\"font-weight:700;font-size:13.5px\">{{ userName }}<\u002Fdiv>\n        <div style=\"font-size:11px;opacity:.72;font-weight:600\">{{ roleLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ logout }}\" title=\"Sair\" style=\"margin-left:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:9px 13px;font-weight:700;font-size:12.5px;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.2)\">Sair<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <nav style=\"max-width:1560px;margin:14px auto 0;display:flex;gap:8px;flex-wrap:wrap\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"7\">\n      <button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main style=\"max-width:1560px;margin:0 auto;padding:26px 3vw 70px\">\n\n<!-- ===================== EXECUTIVA ===================== -->\n<sc-if value=\"{{ show.exec }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#fff7e6;border:1px solid #f4d58d;border-left:5px solid #d69e2e;padding:13px 16px;border-radius:12px;margin-bottom:18px;font-size:13.5px;color:#7c5a12\"><strong>Nota PMO:<\u002Fstrong> visão AS IS do portfólio. Nenhuma alteração foi feita nas fontes; itens antigos exigem validação do responsável antes de qualquer encerramento.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:1 28px;margin-top:5px;font-weight:900;color:{{ k.color }}\">{{ k.value }}<\u002Fstrong>\n        <em style=\"font-size:11.5px;color:#94a3b8;font-style:normal\">{{ k.note }}<\u002Fem>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px\">\n    <sc-for list=\"{{ companyCards }}\" as=\"c\" hint-placeholder-count=\"8\">\n      <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:18px;box-shadow:0 5px 16px rgba(29,41,57,.04);position:relative;overflow:hidden\">\n        <div style=\"position:absolute;left:0;top:0;bottom:0;width:4px;background:{{ c.statusColor }}\"><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px\">\n          <div>\n            <div style=\"font-size:17px;font-weight:800\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#94a3b8;margin-top:1px\">{{ c.city }}<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;color:{{ c.statusColor }}\"><span style=\"width:9px;height:9px;border-radius:50%;background:{{ c.statusColor }}\"><\u002Fspan>{{ c.statusText }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:7px;margin-top:12px;flex-wrap:wrap\">\n          <span style=\"font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#eaf1fb;color:#2563a8\">{{ c.systemLabel }}<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#f2f4f7;color:#475467\">{{ c.pmo }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ c.hasProgress }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:14px\">\n            <div style=\"display:flex;justify-content:space-between;font-size:11.5px;color:#64748b;font-weight:700;margin-bottom:5px\"><span>Avanço estimado<\u002F n:3px 0 0\">{{ p.name }}<\u002Fh3><\u002Fdiv>\n          <span style=\"{{ p.badgeStyle }}\">{{ p.status }}<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"color:#475467;font-size:13.5px;min-height:40px;margin:8px 0 0\">{{ p.summary }}<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0\">\n          <div style=\"background:#f8fafc;border-radius:10px;padding:9px\"><small style=\"display:block;color:#94a3b8;font-size:10px\">Lead<\u002Fsmall><strong style=\"display:block;font-size:12px;margin-top:2px;overflow-wrap:anywhere\">{{ p.lead }}<\u002Fstrong><\u002Fdiv>\n          <div style=\"background:#f8fafc;border-radius:10px;padding:9px\"><small style=\"display:block;color:#94a3b8;font-size:10px\">Início<\u002Fsmall><strong style=\"display:block;font-size:12px;margin-top:2px\">{{ p.start }}<\u002Fstrong><\u002Fdiv>\n          <div style=\"background:#f8fafc;border-radius:10px;padding:9px\"><small style=\"display:block;color:#94a3b8;font-size:10px\">Meta<\u002Fsmall><strong style=\"display:block;font-size:12px;margin-top:2px\">{{ p.meta }}<\u002Fstrong><\u002Fdiv>\n          <div style=\"background:#f8fafc;border-radius:10px;padding:9px\"><small style=\"display:block;color:#94a3b8;font-size:10px\">Leitura PMO<\u002Fsmall><strong style=\"display:block;font-size:12px;margin-top:2px;color:{{ p.pmoColor }}\">{{ p.pmo }}<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;color:#475467;border-top:1px solid #eef1f4;padding-top:11px;margin:0\">{{ p.note }}<\u002Fp>\n        <a href=\"{{ p.link }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;font-weight:700;display:inline-block;margin-top:10px\">Abrir no Linear ↗<\u002Fa>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== DEMANDAS ===================== -->\n<sc-if value=\"{{ show.demandas }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <h2 style=\"margin:0 0 3px;font-size:18px\">{{ demandasTitle }}<\u002Fh2>\n    <p style=\"color:#64748b;font-size:13px;margin:0\">{{ demandasDesc }}<\u002Fp>\n  <\u002Fdiv>\n  <input sc-camel-on-input=\"{{ onSearch }}\" type=\"search\" placeholder=\"Buscar ID, demanda, projeto ou responsável...\" style=\"width:100%;max-width:380px;padding:11px 13px;border:1px solid #d0d5dd;border-radius:10px;margin-bottom:14px;font-size:14px\">\n  <div style=\"overflow:auto;background:#fff;border:1px solid #e6ebf2;border-radius:16px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;min-width:960px\">\n      <sc-raw-thead><sc-raw-tr>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">ID<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Demanda<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Projeto<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Status<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Prioridade<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Responsável<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Prazo<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Alerta PMO<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ issueRows }}\" as=\"i\" hint-placeholder-count=\"10\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\"><strong>{{ i.id }}<\u002Fstrong><\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.title }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.project }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.status }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.prio }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.owner }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.due }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\"><sc-if value=\"{{ i.hasFlag }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"{{ i.flagStyle }}\">{{ i.flag }}<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== GMUD ===================== -->\n<sc-if value=\"{{ show.gmud }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#eef4fb;border:1px solid #cfe0f5;border-left:5px solid #2563a8;padding:13px 16px;border-radius:12px;margin-bottom:16px;font-size:13.5px;color:#1c4a7d\"><strong>GMUD — Gestão de Mudanças:<\u002Fstrong> {{ gmudIntro }}<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:10px;margin-bottom:18px\">\n    <sc-for list=\"{{ gmudKpis }}\" as=\"k\" hint-placeholder-count=\"6\">\n      <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:13px;padding:13px;box-shadow:0 5px 16px rgba(29,41,57,.04);text-align:center\">\n        <strong style=\"display:block;font-size:24px;font-weight:900;color:{{ k.color }}\">{{ k.value }}<\u002Fstrong>\n        <small style=\"color:#64748b;font-weight:700;font-size:11.5px\">{{ k.label }}<\u002Fsmall>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid;gap:13px\">\n    <sc-for list=\"{{ gmudRows }}\" as=\"g\" hint-placeholder-count=\"5\">\n      <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:240px\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n              <span style=\"font-weight:900;font-size:13px;color:#0f2c4d;letter-spacing:.02em\">{{ g.id }}<\u002Fspan>\n              <span style=\"{{ g.typeStyle }}\">{{ g.type }}<\u002Fspan>\n              <span style=\"{{ g.riskStyle }}\">Risco {{ g.risk }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:800;margin-top:7px\">{{ g.title }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#94a3b8;margin-top:3px\">{{ g.companyName }} · {{ g.affects }}<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"{{ g.statusStyle }}\">{{ g.status }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:15px;padding-top:14px;border-top:1px solid #eef1f4\">\n          <div><small style=\"display:block;color:#94a3b8;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">Solicitante<\u002Fsmall><strong style=\"font-size:13px\">{{ g.requester }}<\u002Fstrong><\u002Fdiv>\n          <div><small style=\"display:block;color:#94a3b8;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">Aprovador<\u002Fsmall><strong style=\"font-size:13px\">{{ g.approver }}<\u002Fstrong><\u002Fdiv>\n          <div><small style=\"display:block;color:#94a3b8;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">Janela<\u002Fsmall><strong style=\"font-size:13px\">{{ g.window }}<\u002Fstrong><\u002Fdiv>\n          <div><small style=\"display:block;color:#94a3b8;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">Rollback<\u002Fsmall><strong style=\"font-size:13px\">{{ g.rollback }}<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ g.canAct }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:9px;margin-top:15px\">\n            <button sc-camel-on-click=\"{{ g.approve }}\" style=\"background:#16865c;color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer\" style-hover=\"background:#12704d\">Aprovar mudança<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ g.reject }}\" style=\"background:#fff;color:#b42318;border:1px solid #f3c1bc;border-radius:9px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer\" style-hover=\"background:#fef2f0\">Rejeitar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ g.acted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:13px;font-size:12.5px;font-weight:700;color:{{ g.actedColor }}\">{{ g.actedMsg }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== VIRADAS ===================== -->\n<sc-if value=\"{{ show.viradas }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <h2 style=\"margin:0 0 3px;font-size:18px\">Viradas &amp; Versões<\u002Fh2>\n    <p style=\"color:#64748b;font-size:13px;margin:0\">{{ viradasDesc }}<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;box-shadow:0 5px 16px rgba(29,41,57,.04);overflow:hidden\">\n    <sc-for list=\"{{ viradaRows }}\" as=\"v\" hint-placeholder-count=\"4\">\n      <div style=\"display:grid;grid-template-columns:96px 1fr;gap:16px;padding:16px 20px;border-bottom:1px solid #eef1f4\">\n        <div style=\"font-size:13px;font-weight:800;color:#0f2c4d\">{{ v.date }}<span style=\"display:block;font-size:11px;color:#94a3b8;font-weight:700\">{{ v.wd }}<\u002Fspan><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14.5px;font-weight:800\">{{ v.title }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#94a3b8;margin:2px 0 8px\">{{ v.companyName }}<\u002Fdiv>\n          <div style=\"display:flex;gap:7px;margin-bottom:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ v.tags }}\" as=\"tg\" hint-placeholder-count=\"2\"><span style=\"{{ tg.style }}\">{{ tg.label }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#475467\">{{ v.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== GOVERNANÇA ===================== -->\n<sc-if value=\"{{ show.governanca }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:22px;box-shadow:0 6px 18px rgba(16,35,59,.05)\">\n    <h2 style=\"margin:0 0 3px;font-size:18px\">Direcionamento para o P.O.<\u002Fh2>\n    <p style=\"color:#64748b;font-size:13px;margin:0 0 18px\">Modelo aprovado conceitualmente: prioridade média e saneamento gradual.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n      <div style=\"background:#fafcff;border:1px solid #e6ebf2;border-radius:14px;padding:18px\"><div style=\"width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#0f2c4d;color:#fff;font-weight:900;margin-bottom:11px\">1<\u002Fdiv><h3 style=\"margin:0 0 6px;font-size:15px\">MAPEAR<\u002Fh3><p style=\"font-size:13px;color:#64748b;margin:0 0 8px\">Revisar projetos e demandas: status, prazos, prioridades, responsáveis, duplicidades e aderência ao escopo.<\u002Fp><strong style=\"font-size:12.5px\">Saída:<\u002Fstrong> <span style=\"font-size:12.5px\">carteira classificada + AS IS.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#fafcff;border:1px solid #e6ebf2;border-radius:14px;padding:18px\"><div style=\"width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#0f2c4d;color:#fff;font-weight:900;margin-bottom:11px\">2<\u002Fdiv><h3 style=\"margin:0 0 6px;font-size:15px\">APROVAR<\u002Fh3><p style=\"font-size:13px;color:#64748b;margin:0 0 8px\">Apresentar o TO BE, decisões necessárias, regras de governança e matriz de saneamento ao PMO/gestão.<\u002Fp><strong style=\"font-size:12.5px\">Saída:<\u002Fstrong> <span style=\"font-size:12.5px\">TO BE aprovado + registro de decisões.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#fafcff;border:1px solid #e6ebf2;border-radius:14px;padding:18px\"><div style=\"width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#0f2c4d;color:#fff;font-weight:900;margin-bottom:11px\">3<\u002Fdiv><h3 style=\"margin:0 0 6px;font-size:15px\">IMPLEMENTAR<\u002Fh3><p style=\"font-size:13px;color:#64748b;margin:0 0 8px\">Executar as mudanças em ondas controladas via GMUD, preservando histórico e justificando alterações.<\u002Fp><strong style=\"font-size:12.5px\">Saída:<\u002Fstrong> <span style=\"font-size:12.5px\">carteira saneada + nova baseline.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff1f0;color:#912018;border:1px solid #fecdca;border-radius:12px;padding:13px;margin-top:16px;font-weight:800;text-align:center;font-size:13.5px\">NENHUMA ALTERAÇÃO ESTRUTURAL DEVE SER FEITA ANTES DA APROVAÇÃO DO TO BE.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px\">\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:22px;box-shadow:0 6px 18px rgba(16,35,59,.05)\">\n      <h2 style=\"margin:0 0 12px;font-size:16px\">Classificação de saneamento<\u002Fh2>\n      <div style=\"display:grid;gap:10px\">\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Manter e executar<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Demanda válida, atual e necessária.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Replanejar<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Válida, mas com prazo, prioridade ou responsável desatualizado.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Validar conclusão<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Status aberto com sinais de que a entrega já pode ter ocorrido.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Cancelar / Arquivar<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Obsoleta, substituída ou de projeto encerrado.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:22px;box-shadow:0 6px 18px rgba(16,35,59,.05)\">\n      <h2 style=\"margin:0 0 12px;font-size:16px\">Critérios mínimos do TO BE<\u002Fh2>\n      <div style=\"display:grid;gap:10px\">\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Owner<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Toda demanda executável deve ter responsável.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Prioridade<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Deve refletir a decisão atual, não o histórico.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Prazo<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Data somente quando representar compromisso real.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Critério de aceite<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Demandas relevantes devem ter conclusão objetiva.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== ACESSOS ===================== -->\n<sc-if value=\"{{ show.acessos }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px\">\n    <div><h2 style=\"margin:0 0 3px;font-size:18px\">Gestão de acessos<\u002Fh2><p style=\"color:#64748b;font-size:13px;margin:0\">Usuários, perfis e permissões do portal. Cada empresa vê apenas os próprios projetos.<\u002Fp><\u002Fdiv>\n    <button style=\"background:#0f2c4d;color:#fff;border:0;border-radius:10px;padding:11px 17px;font-weight:800;font-size:13px;cursor:pointer\" style-hover=\"background:#153c66\">+ Convidar usuário<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"overflow:auto;background:#fff;border:1px solid #e6ebf2;border-radius:16px;box-shadow:0 5px 16px rgba(29,41,57,.04);margin-bottom:20px\">\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;min-width:820px\">\n      <sc-raw-thead><sc-raw-tr>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Usuário<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Perfil<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Empresa / Escopo<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Situação<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Ações<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ userRows }}\" as=\"u\" hint-placeholder-count=\"7\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:12px;border-bottom:1px solid #eef1f4;font-size:13px\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width nt || '#2563a8'; }\n\n  // ---- API (mesma origem: /api/*). Sem servidor, cai no modo demo. ----\n  apiBase() { return this.props.apiBase || '/api'; }\n  async api(path, opts = {}) {\n    const headers = { 'content-type': 'application/json', ...(opts.headers || {}) };\n    if (this.state.token) headers.authorization = 'Bearer ' + this.state.token;\n    const r = await fetch(this.apiBase() + '/' + path, { ...opts, headers });\n    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ('HTTP ' + r.status)); }\n    return r.json();\n  }\n\n  componentDidMount() {\n    const s = this.props.startAs;\n    if (s === 'interno') this.selectRole('admin');\n    else if (s === 'cliente') this.selectRole('gestor');\n  }\n\n  onEmail(e) { this.setState({ email: e.target.value, loginError: '' }); }\n  onPassword(e) { this.setState({ password: e.target.value, loginError: '' }); }\n\n  async onLoginSubmit(e) {\n    e.preventDefault();\n    const { email, password } = this.state;\n    if (!email || !password) { this.setState({ loginError: 'Informe e-mail e senha.' }); return; }\n    this.setState({ loggingIn: true, loginError: '' });\n    try {\n      const res = await this.api('login', { method: 'POST', body: JSON.stringify({ email, password }) });\n      this.setState({ token: res.token, live: true, loggingIn: false }, () => {\n        const role = res.user.role;\n        const map = { admin:{tab:'exec',company:'all'}, pmo:{tab:'exec',company:'all'}, gestor:{tab:'visao'}, usuario:{tab:'visao'} };\n        this.setState({ role, screen:'app', q:'', acted:{}, company: res.user.company_id || 'all', ...map[role] }, () => this.loadData());\n      });\n    } catch (err) {\n      // Sem API disponível (preview) → orienta usar o acesso demo\n      const demo = /Failed to fetch|NetworkError|HTTP 404/i.test(String(err));\n      this.setState({ loggingIn: false, loginError: demo ? 'Login real disponível após o deploy. Use o acesso ao protótipo abaixo.' : String(err.message || err) });\n    }\n  }\n\n  async loadData() {\n    const c = this.state.company;\n    const qs = (this.state.role==='admin'||this.state.role==='pmo') && c && c!=='all' ? ('?company='+c) : '';\n    try {\n      const [companies, projects, issues, gmud, releases, documents] = await Promise.all([\n        this.api('companies'), this.api('projects'+qs), this.api('issues'+qs),\n        this.api('gmud'+qs), this.api('releases'+qs), this.api('documents'+qs)\n      ]);\n      this.companies = companies.map(r => ({ id:r.id, name:r.name, city:r.city, system:r.system, own:!!r.own_system, lead:r.lead, start:r.start_date, status:r.status, statusText:r.status_text, pmo:r.pmo_mode, progress:r.progress, summary:r.summary }));\n      this.projects = projects.map(r => ({ name:r.name, status:r.status, badge:r.badge, urgency:r.urgency, summary:r.summary, lead:r.lead, start:r.start_date, meta:r.meta_date, pmo:r.pmo_read, note:r.note, link:r.linear_url }));\n      this.issues = issues.map(r => ({ id:r.id, title:r.title, project:r.project, company:r.company_id, status:r.status, prio:r.priority, owner:r.owner, due:r.due_date, flag:r.flag, flagType:r.flag_type }));\n      this.viradas = releases.map(r => ({ date:r.rel_date, wd:r.weekday, company:r.company_id, title:r.title, desc:r.description, tags: JSON.parse(r.tags || '[]') }));\n      this.docs = documents.map(r => ({ company:r.company_id, name:r.name, type:r.doc_type, date:r.doc_date, ext:r.ext }));\n      this.setState(s => ({ gmud: gmud.map(g => ({ id:g.id, title:g.title, company:g.company_id, type:g.type, risk:g.risk, status:g.status, requester:g.requester, approver:g.approver, window:g.window_txt, affects:g.affects, rollback:g.rollback, client:!!g.client_visible })) }));\n      if (this.state.role==='admin') { try { const users = await this.api('users'); this.users = users.map(u => ({ name:u.name, email:u.email, role:this.roleName(u.role), company:u.company_id||'Allamo (todas)', status:u.status })); } catch(e){} }\n      this.forceUpdate();\n    } catch (e) { /* mantém dados embutidos */ }\n  }\n  roleName(r){ return {admin:'Admin Allamo',pmo:'Consultor PMO',gestor:'Gestor da empresa',usuario:'Usuário comum'}[r]||r; }\n\n  selectRole(r) {\n    const map = { admin:{tab:'exec',company:'all'}, pmo:{tab:'exec',company:'all'}, gestor:{tab:'visao',company:'esposende'}, usuario:{tab:'visao',company:'fergranos'} };\n    this.setState({ role:r, screen:'app', q:'', acted:{}, ...map[r] });\n  }\n  logout() { this.setState({ screen:'login', role:null, tab:'exec', company:'all', q:'', acted:{}, token:null, live:false, email:'', password:'' }); }\n  setTab(t) { this.setState({ tab:t }); }\n  onCompanyChange(e) { this.setState({ company:e.target.value }, () => { if (this.state.live) this.loadData(); }); }\n  onSearch(e) { this.setState({ q:e.target.value }); }\n  gmudAct(id, status, msg, color) {\n    this.setState(s => ({ gmud: s.gmud.map(g => g.id===id ? {...g, status} : g), acted: {...s.acted, [id]:{msg,color}} }));\n    if (this.state.live) this.api('gmud/'+id, { method:'POST', body: JSON.stringify({ decision: status }) }).catch(()=>{});\n  }\n  ini(name) {\n    if (!name || name==='A definir' || name==='Não informado' || name==='—') return '?';\n    return name.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();\n  }\n  pill(bg, fg) { return `background:${bg};color:${fg};font-weight:800;font-size:11px;padding:5px 10px;border-radius:999px;white-space:nowrap;display:inline-block`; }\n\n  renderVals() {\n    const st = this.state, role = st.role, accent = this.ACCENT();\n    const isInternal = role==='admin' || role==='pmo';\n    const isClient = role==='gestor' || role==='usuario';\n    const isAdmin = role==='admin';\n    const canApprove = role==='admin' || role==='pmo' || role==='gestor';\n    const coMap = {}; this.companies.forEach(c => coMap[c.id]=c);\n    const activeCo = coMap[st.company] || this.companies[0];\n\n    // tabs\n    const internalTabs = [['exec','Visão Executiva'],['empresas','Empresas'],['projetos','Projetos'],['demandas','Demandas'],['gmud','GMUD'],['viradas','Viradas'],['governanca','Governança']];\n    if (isAdmin) internalTabs.push(['acessos','Acessos']);\n    const clientTabs = [['visao','Meu Projeto'],['demandas','Demandas & Prazos'],['gmud','Mudanças (GMUD)'],['viradas','Viradas & Versões'],['documentos','Documentos']];\n    const src = isClient ? clientTabs : internalTabs;\n    const tabs = src.map(([id,label]) => {\n      const on = st.tab===id;\n      return { id, label, go:()=>this.setTab(id),\n        style:`padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;border:1px solid ${on?accent:'rgba(255,255,255,.25)'};background:${on?'#fff':'rgba(255,255,255,.08)'};color:${on?'#0f2c4d':'#fff'};transition:all .15s` };\n    });\n    const show = { exec:false, empresas:false, projetos:false, demandas:false, gmud:false, viradas:false, governanca:false, acessos:false, visao:false, documentos:false };\n    show[st.tab] = true;\n\n    // scope helper\n    const inScope = (compId) => {\n      if (isClient) return compId === activeCo.id;\n      if (st.company === 'all') return true;\n      return compId === st.company;\n    };\n\n    // executive\n    const execKpis = [\n      {label:'Projetos', value:'7', note:'portfólio atual'},\n      {label:'Demandas', value:'259', note:'não arquivadas'},\n      {label:'Em andamento', value:'3', note:'projetos'},\n      {label:'Backlog', value:'2', note:'projetos'},\n      {label:'Completo', value:'1', note:'projeto'},\n      {label:'Cancelado', value:'1', note:'projeto'}\n    ];\n    const findings = [\n      {title:'Divergência Projeto × Execução', desc:'DVOLV está em Backlog, mas possui múltiplas issues em andamento.', color:'#b42318'},\n      {title:'Projeto cancelado com backlog', desc:'Danicar está cancelado, porém mantém demandas abertas no Backlog.', color:'#b42318'},\n      {title:'Prazos antigos ainda abertos', desc:'Há issues de jan/fev/abr/mai/jun ainda marcadas como Em andamento.', color:'#b42318'},\n      {title:'Priorização incompleta', desc:'Grande quantidade de issues está como \"Sem prioridade\".', color:'#b7791f'},\n      {title:'Demandas sem projeto', desc:'Funcionalidades, bugs e melhorias sem associação a projeto/frente.', color:'#b7791f'}\n    ];\n\n    // empresas\n    const withDono = this.companies.filter(c=>c.lead && c.lead!=='A definir').length;\n    const semDono = this.companies.length - withDono;\n    const proprio = this.companies.filter(c=>c.own).length;\n    const empresasKpis = [\n      {label:'Empresas na carteira', value:String(this.companies.length), note:'clientes ativos', color:'#0f2c4d'},\n      {label:'Sistema próprio', value:String(proprio), note:'SallamoS · '+(this.companies.length-proprio)+' terceiros', color:'#0f2c4d'},\n      {label:'Com dono definido', value:String(withDono), note:'responsável atribuído', color:'#16865c'},\n      {label:'Sem responsável', value:String(semDono), note:'atribuir no planning', color:'#b42318'}\n    ];\n    const companyCards = this.companies.map(c => {\n      const sc = this.SC[c.status];\n      const tbd = !c.lead || c.lead==='A definir';\n      return { ...c, statusColor:sc, systemLabel:(c.own?'SallamoS':c.system), hasProgress:c.progress!=null,\n        progressW:(c.progress||0)+'%', ownerInitials:this.ini(c.lead), ownerColor:tbd?'#b42318':'#0f2c4d', ownerTextColor:tbd?'#b42318':'#10233b',\n        lead:c.lead||'A definir', open:()=>this.setState({company:c.id, tab:'demandas'}) };\n    });\n\n    // projetos\n    const badgeMap = { started:['#eaf2ff','#175cd3'], backlog:['#f2f4f7','#475467'], completed:['#e8f7f0','#027a48'], canceled:['#feeceb','#b42318'] };\n    const pmoColorMap = { 'Crítico':'#b42318', 'Atenção':'#b7791f', 'Regular':'#16865c' };\n    const projectCards = this.projects.map(p => {\n      const b = badgeMap[p.badge];\n      return { ...p, badgeStyle:this.pill(b[0],b[1]), pmoColor:pmoColorMap[p.pmo]||'#64748b' };\n    });\n\n    // demandas\n    let issueBase = this.issues.filter(i => isClient ? i.company===activeCo.id : (st.company==='all'?true:i.company===st.company));\n    const q = st.q.trim().toLowerCase();\n    if (q) issueBase = issueBase.filter(i => (i.id+' '+i.title+' '+i.project+' '+i.owner).toLowerCase().includes(q));\n    const issueRows = issueBase.map(i => ({ ...i, hasFlag:!!i.flag,\n      flagStyle: i.flagType==='c' ? this.pill('#feeceb','#b42318') : this.pill('#fff4e5','#b54708') }));\n    const demandasTitle = isClient ? 'Demandas do seu projeto' : 'Recorte de demandas que exigem validação';\n    const demandasDesc = isClient ? 'Itens abertos e prazos do projeto '+activeCo.name+'. Fale com seu consultor PMO para priorizações.' : 'Itens selecionados por risco de prazo, divergência de projeto ou governança. Inventário total: 259 issues não arquivadas.';\n\n    // gmud\n    let gmudBase = st.gmud.filter(g => isClient ? (g.company===activeCo.id && g.client) : (st.company==='all'?true:g.company===st.company));\n    const gStyle = {\n      'Rascunho':['#eef1f4','#475467'], 'Em aprovação':['#fff4e5','#b54708'], 'Aprovada':['#eaf2ff','#175cd3'],\n      'Agendada':['#eef2ff','#4f46e5'], 'Implementada':['#e8f7f0','#027a48'], 'Rejeitada':['#feeceb','#b42318']\n    };\n    const riskStyleMap = { 'Alto':['#feeceb','#b42318'], 'Médio':['#fff4e5','#b54708'], 'Baixo':['#e8f7f0','#027a48'] };\n    const typeStyleMap = { 'Emergencial':['#feeceb','#b42318'], 'Normal':['#eaf1fb','#2563a8'], 'Padrão':['#f2f4f7','#475467'] };\n    const gmudRows = gmudBase.map(g => {\n      const gs = gStyle[g.status]||['#eef1f4','#475467'];\n      const rs = riskStyleMap[g.risk]||['#eef1f4','#475467'];\n      const ts = typeStyleMap[g.type]||['#eef1f4','#475467'];\n      const acted = st.acted[g.id];\n      return { ...g, companyName: g.company ? (coMap[g.company]?coMap[g.company].name:g.company) : 'Portfólio (sem empresa)',\n        statusStyle:this.pill(gs[0],gs[1])+';font-size:12.5px;padding:7px 13px', riskStyle:this.pill(rs[0],rs[1]), typeStyle:this.pill(ts[0],ts[1]),\n        canAct: canApprove && g.status==='Em aprovação' && !acted,\n        acted: !!acted, actedMsg: acted?acted.msg:'', actedColor: acted?acted.color:'#16865c',\n        approve:()=>this.gmudAct(g.id,'Aprovada','✓ Mudança aprovada — encaminhada para agendamento.','#16865c'),\n        reject:()=>this.gmudAct(g.id,'Rejeitada','✕ Mudança rejeitada — retornada ao solicitante.','#b42318') };\n    });\n    const countBy = (s) => gmudBase.filter(g=>g.status===s).length;\n    const gmudKpis = [\n      {label:'Total', value:String(gmudBase.length), color:'#0f2c4d'},\n      {label:'Aprovação', value:String(countBy('Em aprovação')), color:'#b54708'},\n      {label:'Agendadas', value:String(countBy('Agendada')+countBy('Aprovada')), color:'#4f46e5'},\n      {label:'Implementadas', value:String(countBy('Implementada')), color:'#027a48'},\n      {label:'Rejeitadas', value:String(countBy('Rejeitada')), color:'#b42318'},\n      {label:'Rascunhos', value:String(countBy('Rascunho')), color:'#64748b'}\n    ];\n    const gmudIntro = isClient ? 'mudanças planejadas e realizadas no seu sistema. Gestores podem aprovar as que aguardam liberação.' : 'toda alteração relevante passa por registro, avaliação de risco, aprovação e janela controlada antes de ir a produção.';\n\n    // viradas\n    let vBase = this.viradas.filter(v => isClient ? v.company===activeCo.id : (st.company==='all'?true:v.company===st.company));\n    const tagStyleMap = { sal:['#eaf1fb','#2563a8'], cli:['#e8f7f0','#027a48'], '':['#f2f4f7','#475467'] };\n    const viradaRows = vBase.map(v => ({ ...v, companyName:(coMap[v.company]?coMap[v.company].name:v.company),\n      tags: v.tags.map(t => ({ label:t[0], style:this.pill((tagStyleMap[t[1]]||tagStyleMap[''])[0],(tagStyleMap[t[1]]||tagStyleMap[''])[1]) })) }));\n    const viradasDesc = isClient ? 'Melhorias e versões entregues no seu sistema — inclusive os deploys de sábado.' : 'Registro das melhorias e versões subidas por empresa, com visibilidade ao cliente.';\n\n    // acessos\n    const statusStyleMap = { 'Ativo':['#e8f7f0','#027a48'], 'Convidado':['#fff4e5','#b54708'], 'Bloqueado':['#feeceb','#b42318'] };\n    const userRows = this.users.map(u => ({ ...u, initials:this.ini(u.name), statusStyle:this.pill((statusStyleMap[u.status]||['#eef1f4','#475467'])[0],(statusStyleMap[u.status]||['#eef1f4','#475467'])[1]) }));\n    const permGlyph = { 2:'●', 1:'◐', 0:'○' };\n    const permColor = { 2:'#16865c', 1:'#b7791f', 0:'#cbd5e1' };\n    const permRows = this.perms.map(p => ({ feature:p.feature,\n      admin:permGlyph[p.v[0]], pmo:permGlyph[p.v[1]], gestor:permGlyph[p.v[2]], usuario:permGlyph[p.v[3]],\n      c0:permColor[p.v[0]], c1:permColor[p.v[1]], c2:permColor[p.v[2]], c3:permColor[p.v[3]] }));\n\n    // client visão\n    const myIssues = this.issues.filter(i => i.company===activeCo.id);\n    const abertas = myIssues.filter(i => i.status!=='Completo').length;\n    const vencidas = myIssues.filter(i => i.flag==='Prazo vencido').length;\n    const myV = this.viradas.filter(v => v.company===activeCo.id).slice(0,3);\n    const myGmudPend = st.gmud.filter(g => g.company===activeCo.id && (g.status==='Em aprovação'||g.status==='Agendada')).length;\n    const clientKpis = [\n      {label:'Demandas abertas', value:String(abertas), note:'no seu projeto', color:'#0f2c4d'},\n      {label:'Prazos vencidos', value:String(vencidas), note:'requerem atenção', color: vencidas>0?'#b42318':'#16865c'},\n      {label:'Mudanças pendentes', value:String(myGmudPend), note:'GMUD em curso', color:'#4f46e5'},\n      {label:'Última virada', value:(myV[0]?myV[0].date.slice(0,5):'—'), note:'deploy recente', color:'#16865c'}\n    ];\n    const clientRecent = myV.length ? myV : [{date:'—', title:'Sem viradas registradas', desc:'As entregas do seu projeto aparecerão aqui.'}];\n\n    const co = { ...activeCo, statusColor:this.SC[activeCo.status], progressW:(activeCo.progress||0)+'%', systemLabel:(activeCo.own?'SallamoS':activeCo.system), progress:activeCo.progress||0, summary:activeCo.summary||'Projeto acompanhado pelo PMO Államo.' };\n\n    // documentos\n    const docColor = { PDF:'#b42318', XLS:'#027a48', DOC:'#2563a8' };\n    const docRows = this.docs.filter(d => d.company===activeCo.id).map(d => ({ ...d, color:docColor[d.ext]||'#64748b' }));\n\n    // company selector\n    const companyOptions = [{id:'all', name:'Todas as empresas', sel:st.company==='all'}].concat(this.companies.map(c=>({id:c.id, name:c.name, sel:st.company===c.id})));\n\n    const roleLabels = { admin:'Admin Allamo', pmo:'Consultor PMO', gestor:'Gestor da empresa', usuario:'Usuário comum' };\n    const userNames = { admin:'Renan Rondon', pmo:'Fábio Landin', gestor:'Gestor · '+activeCo.name, usuario:'Operação · '+activeCo.name };\n    const contextLabels = { admin:'Visão de toda a carteira', pmo:'Governança e saneamento', gestor:activeCo.name, usuario:activeCo.name };\n\n    const roleCards = [\n      {id:'admin', name:'Admin Allamo', desc:'Acesso total: portfólio, empresas, GMUD e gestão de acessos', badge:'AA', color:'#0f2c4d', go:()=>this.selectRole('admin')},\n      {id:'pmo', name:'Consultor PMO', desc:'Governança, saneamento e acompanhamento dos projetos', badge:'PMO', color:'#2563a8', go:()=>this.selectRole('pmo')},\n      {id:'gestor', name:'Gestor da empresa', desc:'Painel da sua empresa · entrando como Esposende', badge:'GE', color:'#16865c', go:()=>this.selectRole('gestor')},\n      {id:'usuario', name:'Usuário comum', desc:'Acompanhamento da sua empresa · entrando como FerGranos', badge:'US', color:'#b7791f', go:()=>this.selectRole('usuario')}\n    ];\n\n    return {\n      isLogin: st.screen==='login', isApp: st.screen==='app',\n      emailVal: st.email, passwordVal: st.password, onEmail:(e)=>this.onEmail(e), onPassword:(e)=>this.onPassword(e),\n      onLoginSubmit:(e)=>this.onLoginSubmit(e), hasLoginError: !!st.loginError, loginError: st.loginError,\n      loginBtnLabel: st.loggingIn ? 'Entrando…' : 'Entrar',\n      isInternal, isClient, roleCards, tabs, show,\n      contextLabel: contextLabels[role]||'', roleLabel: roleLabels[role]||'', userName: userNames[role]||'', userInitials: this.ini((userNames[role]||'U').replace(/·.*/,'').trim())||'U',\n      logout:()=>this.logout(), onCompanyChange:(e)=>this.onCompanyChange(e), onSearch:(e)=>this.onSearch(e), companyOptions,\n      execKpis, findings, empresasKpis, companyCards, projectCards,\n      issueRows, demandasTitle, demandasDesc,\n      gmudRows, gmudKpis, gmudIntro,\n      viradaRows, viradasDesc,\n      userRows, permRows,\n      co, clientKpis, clientRecent, docRows, noDocs: docRows.length===0\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
