-size:11.5px;font-weight:700;color:#475467\">Nota<input sc-camel-on-input=\"{{ k.onNote }}\" value=\"{{ k.note }}\" style=\"display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\"><\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:11px;color:#898781;font-weight:600\">Barras do consumo mensal (mês e horas realizadas):<\u002Fdiv>\n      <sc-for list=\"{{ edHoursBars }}\" as=\"b\" hint-placeholder-count=\"3\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n          <input sc-camel-on-input=\"{{ b.onMonth }}\" value=\"{{ b.month }}\" placeholder=\"mês (ex.: jul/26)\" style=\"padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\">\n          <input sc-camel-on-input=\"{{ b.onValue }}\" value=\"{{ b.value }}\" placeholder=\"horas\" style=\"padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div data-ed=\"sec-curva\" style=\"font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#52514e;margin-top:8px;border-top:1px solid #eef1f4;padding-top:14px\">Curva S (horas acumuladas)<\u002Fdiv>\n      <label style=\"font-size:11.5px;font-weight:700;color:#475467\">Meses (separados por vírgula)<input sc-camel-on-input=\"{{ onCurveMonths }}\" value=\"{{ edCurveMonths }}\" style=\"display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\"><\u002Flabel>\n      <label style=\"font-size:11.5px;font-weight:700;color:#475467\">Previsto acumulado (vírgula)<input sc-camel-on-input=\"{{ onCurvePrev }}\" value=\"{{ edCurvePrev }}\" style=\"display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\"><\u002Flabel>\n      <label style=\"font-size:11.5px;font-weight:700;color:#475467\">Realizado acumulado (vírgula; vazio = sem dado)<input sc-camel-on-input=\"{{ onCurveReal }}\" value=\"{{ edCurveReal }}\" style=\"display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\"><\u002Flabel>\n\n      <div data-ed=\"sec-crono\" style=\"font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#52514e;margin-top:8px;border-top:1px solid #eef1f4;padding-top:14px\">Cronograma (horas por pilar/mês)<\u002Fdiv>\n      <sc-for list=\"{{ edCrono }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;gap:6px;border:1px solid #eef1f4;border-radius:10px;padding:10px\">\n          <input sc-camel-on-input=\"{{ c.onName }}\" value=\"{{ c.name }}\" placeholder=\"Pilar\" style=\"padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px;font-weight:600\">\n          <input sc-camel-on-input=\"{{ c.onHours }}\" value=\"{{ c.hcsv }}\" placeholder=\"horas por mês (vírgula)\" style=\"padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div data-ed=\"sec-cap\" style=\"font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#52514e;margin-top:8px;border-top:1px solid #eef1f4;padding-top:14px\">Capacidade<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px\">\n        <label style=\"font-size:11.5px;font-weight:700;color:#475467\">Meta/mês<input sc-camel-on-input=\"{{ onCapMeta }}\" value=\"{{ edCapMeta }}\" style=\"display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\"><\u002Flabel>\n        <label style=\"font-size:11.5px;font-weight:700;color:#475467\">Consumido<input sc-camel-on-input=\"{{ onCapUsed }}\" value=\"{{ edCapUsed }}\" style=\"display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\"><\u002Flabel>\n        <label style=\"font-size:11.5px;font-weight:700;color:#475467\">Contrato<inp
