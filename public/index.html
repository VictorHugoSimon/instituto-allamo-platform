 <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== DEMANDAS ===================== -->\n<sc-if value=\"{{ show.demandas }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap\">\n      <div><h2 style=\"margin:0 0 3px;font-size:18px\">{{ demandasTitle }}<\u002Fh2>\n      <p style=\"color:#64748b;font-size:13px;margin:0\">{{ demandasDesc }}<\u002Fp><\u002Fdiv>\n      <sc-if value=\"{{ canSyncLinear }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:right\">\n          <button sc-camel-on-click=\"{{ syncLinear }}\" style=\"background:#5e6ad2;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;font-size:13px;cursor:pointer\" style-hover=\"background:#4f5bc0\">{{ syncLabel }}<\u002Fbutton>\n          <div style=\"font-size:11px;color:#94a3b8;margin-top:6px\">{{ linearStatus }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ horasSync }}\" style=\"background:#0f6b4f;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:800;font-size:13px;cursor:pointer;margin-top:8px\">{{ horasLabel }}<\u002Fbutton>\n          <div style=\"font-size:11px;color:#94a3b8;margin-top:6px\">{{ horasStatus }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <input sc-camel-on-input=\"{{ onSearch }}\" type=\"search\" placeholder=\"Buscar ID, demanda, projeto ou responsável...\" style=\"width:100%;max-width:380px;padding:11px 13px;border:1px solid #d0d5dd;border-radius:10px;margin-bottom:14px;font-size:14px\">\n  <div style=\"overflow:auto;background:#fff;border:1px solid #e6ebf2;border-radius:16px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;min-width:960px\">\n      <sc-raw-thead><sc-raw-tr>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">ID<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Demanda<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Projeto<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Status<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Prioridade<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Responsável<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Prazo<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Alerta PMO<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ issueRows }}\" as=\"i\" hint-placeholder-count=\"10\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\"><strong>{{ i.id }}<\u002Fstrong><\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.title }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.project }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.status }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.prio }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.owner }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ i.due }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\"><sc-if value=\"{{ i.hasFlag }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"{{ i.flagStyle }}\">{{ i.flag }}<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== GMUD ===================== -->\n<sc-if value=\"{{ show.gmud }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <sc-if value=\"{{ canCreateGmud }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;justify-content:flex-end;margin-bottom:12px\"><button sc-camel-on-click=\"{{ openGmud }}\" style=\"background:#302f39;color:#fff;border:0;border-radius:10px;padding:11px 17px;font-weight:800;font-size:13px;cursor:pointer\" style-hover=\"background:#45434f\">+ Nova GMUD<\u002Fbutton><\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"background:#f5efe9;border:1px solid #e4d3ca;border-left:5px solid #9a6b56;padding:13px 16px;border-radius:12px;margin-bottom:16px;font-size:13.5px;color:#3d3c48\"><strong>GMUD — Gestão de Mudanças:<\u002Fstrong> {{ gmudIntro }}<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:10px;margin-bottom:18px\">\n    <sc-for list=\"{{ gmudKpis }}\" as=\"k\" hint-placeholder-count=\"6\">\n      <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:13px;padding:13px;box-shadow:0 5px 16px rgba(29,41,57,.04);text-align:center\">\n        <strong style=\"display:block;font-size:24px;font-weight:900;color:{{ k.color }}\">{{ k.value }}<\u002Fstrong>\n        <small style=\"color:#64748b;font-weight:700;font-size:11.5px\">{{ k.label }}<\u002Fsmall>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid;gap:13px\">\n    <sc-for list=\"{{ gmudRows }}\" as=\"g\" hint-placeholder-count=\"5\">\n      <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:240px\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n              <span style=\"font-weight:900;font-size:13px;color:#302f39;letter-spacing:.02em\">{{ g.id }}<\u002Fspan>\n              <span style=\"{{ g.typeStyle }}\">{{ g.type }}<\u002Fspan>\n              <span style=\"{{ g.riskStyle }}\">Risco {{ g.risk }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:800;margin-top:7px\">{{ g.title }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#94a3b8;margin-top:3px\">{{ g.companyName }} · {{ g.affects }}<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"{{ g.statusStyle }}\">{{ g.status }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:15px;padding-top:14px;border-top:1px solid #eef1f4\">\n          <div><small style=\"display:block;color:#94a3b8;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">Solicitante<\u002Fsmall><strong style=\"font-size:13px\">{{ g.requester }}<\u002Fstrong><\u002Fdiv>\n          <div><small style=\"display:block;color:#94a3b8;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">Aprovador<\u002Fsmall><strong style=\"font-size:13px\">{{ g.approver }}<\u002Fstrong><\u002Fdiv>\n          <div><small style=\"display:block;color:#94a3b8;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">Janela<\u002Fsmall><strong style=\"font-size:13px\">{{ g.window }}<\u002Fstrong><\u002Fdiv>\n          <div><small style=\"display:block;color:#94a3b8;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">Rollback<\u002Fsmall><strong style=\"font-size:13px\">{{ g.rollback }}<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px;margin-top:15px;padding-top:14px;border-top:1px solid #eef1f4;flex-wrap:wrap\">\n          <sc-for list=\"{{ g.steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"{{ s.dotStyle }}\">{{ s.dot }}<\u002Fspan><span style=\"{{ s.lblStyle }}\">{{ s.label }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap\">\n          <span style=\"{{ g.pmoBadgeStyle }}\">{{ g.pmoBadge }}<\u002Fspan>\n          <span style=\"{{ g.tlBadgeStyle }}\">{{ g.tlBadge }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:9px;margin-top:13px;flex-wrap:wrap\">\n          <sc-if value=\"{{ g.showPmoBtn }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ g.approvePmo }}\" style=\"background:#16865c;color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:800;font-size:13px;cursor:pointer\" style-hover=\"background:#12704d\">Aprovar (PMO)<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ g.showTlBtn }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ g.approveTl }}\" style=\"background:#2a78d6;color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:800;font-size:13px;cursor:pointer\" style-hover=\"background:#2062b3\">Aprovar (Techlead)<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ g.showReject }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ g.reject }}\" style=\"background:#fff;color:#b42318;border:1px solid #f3c1bc;border-radius:9px;padding:9px 15px;font-weight:800;font-size:13px;cursor:pointer\" style-hover=\"background:#fef2f0\">Rejeitar<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ g.acted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:13px;font-size:12.5px;font-weight:700;color:{{ g.actedColor }}\">{{ g.actedMsg }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== RCA ===================== -->\n<sc-if value=\"{{ show.rca }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px\">\n    <div><h2 style=\"margin:0 0 3px;font-size:18px\">RCA — Análise de Causa Raiz<\u002Fh2><p style=\"color:#64748b;font-size:13px;margin:0\">Registro pós-incidente: o que aconteceu, causa raiz, correção e prevenção.<\u002Fp><\u002Fdiv>\n    <sc-if value=\"{{ canCreateGmud }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ openRca }}\" style=\"background:#302f39;color:#fff;border:0;border-radius:10px;padding:11px 17px;font-weight:800;font-size:13px;cursor:pointer\">+ Novo RCA<\u002Fbutton><\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"display:grid;gap:12px\">\n    <sc-for list=\"{{ rcaRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n      <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:16px 18px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap\">\n          <div style=\"font-size:15px;font-weight:800\">{{ r.title }}<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#94a3b8\">{{ r.meta }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:8px;margin-top:10px\">\n          <div style=\"background:#fbfaf8;border:1px solid #eee6de;border-radius:9px;padding:9px 11px;font-size:13px\"><strong style=\"color:#b88b78\">O que aconteceu:<\u002Fstrong> {{ r.what_happened }}<\u002Fdiv>\n          <div style=\"background:#fbfaf8;border:1px solid #eee6de;border-radius:9px;padding:9px 11px;font-size:13px\"><strong style=\"color:#b88b78\">Impacto:<\u002Fstrong> {{ r.impact }}<\u002Fdiv>\n          <div style=\"background:#fbfaf8;border:1px solid #eee6de;border-radius:9px;padding:9px 11px;font-size:13px\"><strong style=\"color:#b88b78\">Causa raiz:<\u002Fstrong> {{ r.root_cause }}<\u002Fdiv>\n          <div style=\"background:#fbfaf8;border:1px solid #eee6de;border-radius:9px;padding:9px 11px;font-size:13px\"><strong style=\"color:#b88b78\">Correção:<\u002Fstrong> {{ r.correction }}<\u002Fdiv>\n          <div style=\"background:#fbfaf8;border:1px solid #eee6de;border-radius:9px;padding:9px 11px;font-size:13px\"><strong style=\"color:#b88b78\">Prevenção:<\u002Fstrong> {{ r.prevention }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ r.canDelete }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:10px;text-align:right\"><button sc-camel-on-click=\"{{ r.del }}\" style=\"background:none;border:0;color:#b42318;font-weight:700;font-size:12.5px;cursor:pointer\">Excluir<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ noRca }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:36px;text-align:center;color:#94a3b8;font-size:14px\">Nenhum RCA registrado ainda. Use \"+ Novo RCA\" após um incidente ou mudança com problema.<\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== VIRADAS ===================== -->\n<sc-if value=\"{{ show.viradas }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 5px 16px rgba(29,41,57,.04);display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap\">\n    <div><h2 style=\"margin:0 0 3px;font-size:18px\">Viradas &amp; Versões<\u002Fh2>\n    <p style=\"color:#64748b;font-size:13px;margin:0\">{{ viradasDesc }}<\u002Fp><\u002Fdiv>\n    <sc-if value=\"{{ canCreateGmud }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ openVirada }}\" style=\"background:#302f39;color:#fff;border:0;border-radius:10px;padding:11px 17px;font-weight:800;font-size:13px;cursor:pointer\">+ Nova virada<\u002Fbutton><\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;box-shadow:0 5px 16px rgba(29,41,57,.04);overflow:hidden\">\n    <sc-for list=\"{{ viradaRows }}\" as=\"v\" hint-placeholder-count=\"4\">\n      <div style=\"display:grid;grid-template-columns:96px 1fr;gap:16px;padding:16px 20px;border-bottom:1px solid #eef1f4\">\n        <div style=\"font-size:13px;font-weight:800;color:#302f39\">{{ v.date }}<span style=\"display:block;font-size:11px;color:#94a3b8;font-weight:700\">{{ v.wd }}<\u002Fspan><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14.5px;font-weight:800\">{{ v.title }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#94a3b8;margin:2px 0 8px\">{{ v.companyName }}<\u002Fdiv>\n          <div style=\"display:flex;gap:7px;margin-bottom:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ v.tags }}\" as=\"tg\" hint-placeholder-count=\"2\"><span style=\"{{ tg.style }}\">{{ tg.label }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#475467\">{{ v.desc }}<\u002Fdiv>\n          <sc-if value=\"{{ v.canDelete }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:8px\"><button sc-camel-on-click=\"{{ v.del }}\" style=\"background:none;border:0;color:#b42318;font-weight:700;font-size:12px;cursor:pointer;padding:0\">Excluir<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== GOVERNANÇA ===================== -->\n<sc-if value=\"{{ show.governanca }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:22px;box-shadow:0 6px 18px rgba(16,35,59,.05)\">\n    <h2 style=\"margin:0 0 3px;font-size:18px\">Direcionamento para o P.O.<\u002Fh2>\n    <p style=\"color:#64748b;font-size:13px;margin:0 0 18px\">Modelo aprovado conceitualmente: prioridade média e saneamento gradual.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n      <div style=\"background:#fafcff;border:1px solid #e6ebf2;border-radius:14px;padding:18px\"><div style=\"width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#302f39;color:#fff;font-weight:900;margin-bottom:11px\">1<\u002Fdiv><h3 style=\"margin:0 0 6px;font-size:15px\">MAPEAR<\u002Fh3><p style=\"font-size:13px;color:#64748b;margin:0 0 8px\">Revisar projetos e demandas: status, prazos, prioridades, responsáveis, duplicidades e aderência ao escopo.<\u002Fp><strong style=\"font-size:12.5px\">Saída:<\u002Fstrong> <span style=\"font-size:12.5px\">carteira classificada + AS IS.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#fafcff;border:1px solid #e6ebf2;border-radius:14px;padding:18px\"><div style=\"width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#302f39;color:#fff;font-weight:900;margin-bottom:11px\">2<\u002Fdiv><h3 style=\"margin:0 0 6px;font-size:15px\">APROVAR<\u002Fh3><p style=\"font-size:13px;color:#64748b;margin:0 0 8px\">Apresentar o TO BE, decisões necessárias, regras de governança e matriz de saneamento ao PMO/gestão.<\u002Fp><strong style=\"font-size:12.5px\">Saída:<\u002Fstrong> <span style=\"font-size:12.5px\">TO BE aprovado + registro de decisões.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#fafcff;border:1px solid #e6ebf2;border-radius:14px;padding:18px\"><div style=\"width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#302f39;color:#fff;font-weight:900;margin-bottom:11px\">3<\u002Fdiv><h3 style=\"margin:0 0 6px;font-size:15px\">IMPLEMENTAR<\u002Fh3><p style=\"font-size:13px;color:#64748b;margin:0 0 8px\">Executar as mudanças em ondas controladas via GMUD, preservando histórico e justificando alterações.<\u002Fp><strong style=\"font-size:12.5px\">Saída:<\u002Fstrong> <span style=\"font-size:12.5px\">carteira saneada + nova baseline.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff1f0;color:#912018;border:1px solid #fecdca;border-radius:12px;padding:13px;margin-top:16px;font-weight:800;text-align:center;font-size:13.5px\">NENHUMA ALTERAÇÃO ESTRUTURAL DEVE SER FEITA ANTES DA APROVAÇÃO DO TO BE.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px\">\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:22px;box-shadow:0 6px 18px rgba(16,35,59,.05)\">\n      <h2 style=\"margin:0 0 12px;font-size:16px\">Classificação de saneamento<\u002Fh2>\n      <div style=\"display:grid;gap:10px\">\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Manter e executar<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Demanda válida, atual e necessária.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Replanejar<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Válida, mas com prazo, prioridade ou responsável desatualizado.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Validar conclusão<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Status aberto com sinais de que a entrega já pode ter ocorrido.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Cancelar / Arquivar<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Obsoleta, substituída ou de projeto encerrado.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:22px;box-shadow:0 6px 18px rgba(16,35,59,.05)\">\n      <h2 style=\"margin:0 0 12px;font-size:16px\">Critérios mínimos do TO BE<\u002Fh2>\n      <div style=\"display:grid;gap:10px\">\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Owner<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Toda demanda executável deve ter responsável.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Prioridade<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Deve refletir a decisão atual, não o histórico.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Prazo<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Data somente quando representar compromisso real.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px;border:1px solid #e6ebf2;border-radius:11px;background:#fafcff\"><strong style=\"display:block;margin-bottom:2px;font-size:13.5px\">Critério de aceite<\u002Fstrong><span style=\"font-size:13px;color:#475467\">Demandas relevantes devem ter conclusão objetiva.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== ACESSOS ===================== -->\n<sc-if value=\"{{ show.acessos }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px\">\n    <div><h2 style=\"margin:0 0 3px;font-size:18px\">Gestão de acessos<\u002Fh2><p style=\"color:#64748b;font-size:13px;margin:0\">Usuários, perfis e permissões do portal. Cada empresa vê apenas os próprios projetos.<\u002Fp><\u002Fdiv>\n    <button sc-camel-on-click=\"{{ openUser }}\" style=\"background:#302f39;color:#fff;border:0;border-radius:10px;padding:11px 17px;font-weight:800;font-size:13px;cursor:pointer\" style-hover=\"background:#45434f\">+ Criar usuário<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"overflow:auto;background:#fff;border:1px solid #e6ebf2;border-radius:16px;box-shadow:0 5px 16px rgba(29,41,57,.04);margin-bottom:20px\">\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;min-width:820px\">\n      <sc-raw-thead><sc-raw-tr>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Usuário<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Perfil<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Empresa / Escopo<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Situação<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Ações<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ userRows }}\" as=\"u\" hint-placeholder-count=\"7\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:12px;border-bottom:1px solid #eef1f4;font-size:13px\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:#302f39\">{{ u.initials }}<\u002Fspan><div><strong>{{ u.name }}<\u002Fstrong><div style=\"font-size:11.5px;color:#94a3b8\">{{ u.email }}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:12px;border-bottom:1px solid #eef1f4;font-size:13px\">{{ u.role }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:12px;border-bottom:1px solid #eef1f4;font-size:13px\">{{ u.company }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:12px;border-bottom:1px solid #eef1f4;font-size:13px\"><span style=\"{{ u.statusStyle }}\">{{ u.status }}<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:12px;border-bottom:1px solid #eef1f4;font-size:13px\"><button sc-camel-on-click=\"{{ u.edit }}\" style=\"background:none;border:0;color:#9a6b56;font-weight:700;font-size:12.5px;cursor:pointer;padding:0\">Editar<\u002Fbutton><\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:22px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <h3 style=\"margin:0 0 4px;font-size:16px\">Matriz de permissões<\u002Fh3>\n    <p style=\"color:#64748b;font-size:13px;margin:0 0 16px\">O que cada perfil pode ver e fazer.<\u002Fp>\n    <div style=\"overflow:auto\">\n      <sc-raw-table style=\"border-collapse:collapse;width:100%;min-width:640px\">\n        <sc-raw-thead><sc-raw-tr>\n          <sc-raw-th style=\"padding:10px 12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Recurso<\u002Fsc-raw-th>\n          <sc-raw-th style=\"padding:10px 12px;text-align:center;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Admin<\u002Fsc-raw-th>\n          <sc-raw-th style=\"padding:10px 12px;text-align:center;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Usuário<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ permRows }}\" as=\"pr\" hint-placeholder-count=\"9\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:10px 12px;border-bottom:1px solid #eef1f4;font-size:13px;font-weight:600\">{{ pr.feature }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:10px 12px;border-bottom:1px solid #eef1f4;font-size:14px;text-align:center;color:{{ pr.c0 }}\">{{ pr.admin }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:10px 12px;border-bottom:1px solid #eef1f4;font-size:14px;text-align:center;color:{{ pr.c3 }}\">{{ pr.usuario }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;margin-top:14px;font-size:12.5px;color:#64748b;font-weight:600\"><span style=\"color:#16865c\">● Acesso total<\u002Fspan><span style=\"color:#b7791f\">◐ Somente leitura<\u002Fspan><span style=\"color:#cbd5e1\">○ Sem acesso<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== CLIENTE: VISÃO ===================== -->\n<sc-if value=\"{{ show.visao }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:linear-gradient(135deg,#302f39,#45434f);color:#fff;border-radius:18px;padding:26px 28px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap\">\n    <div>\n      <div style=\"letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;font-weight:800;opacity:.75\">Painel do cliente<\u002Fdiv>\n      <h1 style=\"font-size:clamp(26px,3vw,38px);margin:6px 0 6px;font-weight:900\">{{ co.name }}<\u002Fh1>\n      <p style=\"opacity:.85;margin:0;font-size:14px\">{{ co.summary }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"text-align:right\">\n      <span style=\"display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;background:rgba(255,255,255,.14);padding:8px 14px;border-radius:999px\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ co.statusColor }}\"><\u002Fspan>{{ co.statusText }}<\u002Fspan>\n      <div style=\"opacity:.75;font-size:12px;margin-top:8px\">Responsável PMO · {{ co.lead }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin-bottom:18px\">\n    <sc-for list=\"{{ clientKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n      <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:15px;padding:16px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n        <small style=\"color:#64748b;font-weight:700;font-size:12px\">{{ k.label }}<\u002Fsmall>\n        <strong style=\"display:block;font-size:27px;margin-top:5px;font-weight:900;color:{{ k.color }}\">{{ k.value }}<\u002Fstrong>\n        <em style=\"font-size:11.5px;color:#94a3b8;font-style:normal\">{{ k.note }}<\u002Fem>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px\"><h2 style=\"margin:0;font-size:16px\">Avanço do projeto<\u002Fh2><span style=\"font-weight:900;font-size:18px;color:{{ co.statusColor }}\">{{ co.progress }}%<\u002Fspan><\u002Fdiv>\n      <div style=\"height:12px;background:#eef1f4;border-radius:8px;overflow:hidden;margin-bottom:18px\"><div style=\"height:100%;border-radius:8px;width:{{ co.progressW }};background:{{ co.statusColor }}\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;gap:10px\">\n        <div style=\"display:flex;justify-content:space-between;font-size:13px;padding:10px;background:#f8fafc;border-radius:10px\"><span style=\"color:#64748b\">Sistema<\u002Fspan><strong>{{ co.systemLabel }}<\u002Fstrong><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:13px;padding:10px;background:#f8fafc;border-radius:10px\"><span style=\"color:#64748b\">Início<\u002Fspan><strong>{{ co.start }}<\u002Fstrong><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:13px;padding:10px;background:#f8fafc;border-radius:10px\"><span style=\"color:#64748b\">Cidade<\u002Fspan><strong>{{ co.city }}<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <h2 style=\"margin:0 0 14px;font-size:16px\">Últimas viradas<\u002Fh2>\n      <div style=\"display:grid;gap:11px\">\n        <sc-for list=\"{{ clientRecent }}\" as=\"v\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding-bottom:11px;border-bottom:1px solid #eef1f4\">\n            <span style=\"font-size:11.5px;font-weight:800;color:#9a6b56;min-width:66px\">{{ v.date }}<\u002Fspan>\n            <div><div style=\"font-size:13.5px;font-weight:700\">{{ v.title }}<\u002Fdiv><div style=\"font-size:12px;color:#94a3b8;margin-top:2px\">{{ v.desc }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== CLIENTE: DOCUMENTOS ===================== -->\n<sc-if value=\"{{ show.documentos }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <h2 style=\"margin:0 0 3px;font-size:18px\">Documentos &amp; Entregas<\u002Fh2>\n    <p style=\"color:#64748b;font-size:13px;margin:0\">Escopos, atas, cronogramas e artefatos do projeto {{ co.name }}.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px\">\n    <sc-for list=\"{{ docRows }}\" as=\"d\" hint-placeholder-count=\"4\">\n      <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:16px;box-shadow:0 5px 16px rgba(29,41,57,.04);display:flex;gap:13px;align-items:center\">\n        <span style=\"width:42px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:900;font-size:11px;color:#fff;background:{{ d.color }}\">{{ d.ext }}<\u002Fspan>\n        <div style=\"flex:1;min-width:0\"><div style=\"font-size:13.5px;font-weight:700;overflow-wrap:anywhere\">{{ d.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:#94a3b8;margin-top:2px\">{{ d.type }} · {{ d.date }}<\u002Fdiv><\u002Fdiv>\n        <a href=\"#\" style=\"font-weight:700;font-size:12.5px;white-space:nowrap\">Baixar ↓<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ noDocs }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:40px;text-align:center;color:#94a3b8;font-size:14px\">Nenhum documento publicado ainda para esta empresa.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== HISTÓRICO / AUDITORIA ===================== -->\n<sc-if value=\"{{ show.historico }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <h2 style=\"margin:0 0 3px;font-size:18px\">Histórico do sistema<\u002Fh2>\n    <p style=\"color:#64748b;font-size:13px;margin:0\">Registro de tudo que acontece: logins, criação/exclusão de projetos, decisões de GMUD e novos usuários.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"overflow:auto;background:#fff;border:1px solid #e6ebf2;border-radius:16px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;min-width:820px\">\n      <sc-raw-thead><sc-raw-tr>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Quando<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Quem<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Ação<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Alvo<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:12px;text-align:left;border-bottom:1px solid #e6ebf2;font-size:12px;background:#f8fafc;color:#475467\">Detalhe<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ auditRows }}\" as=\"a\" hint-placeholder-count=\"8\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px;white-space:nowrap;color:#64748b\">{{ a.when }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\"><strong>{{ a.actor }}<\u002Fstrong><div style=\"font-size:11px;color:#94a3b8\">{{ a.role }}<\u002Fdiv><\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\"><span style=\"{{ a.style }}\">{{ a.action }}<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px\">{{ a.target }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px;color:#475467\">{{ a.detail }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <sc-if value=\"{{ noAudit }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:36px;text-align:center;color:#94a3b8;font-size:14px\">Os eventos aparecerão aqui após o deploy — cada login, projeto ou decisão de GMUD é registrado no banco.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== NOTIFICAÇÕES ===================== -->\n<sc-if value=\"{{ show.notificacoes }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px\">\n    <div><h2 style=\"margin:0 0 3px;font-size:18px\">Notificações<\u002Fh2><p style=\"color:#64748b;font-size:13px;margin:0\">Avisos enviados às empresas. Escolha a empresa e o projeto para direcionar a mensagem.<\u002Fp><\u002Fdiv>\n    <sc-if value=\"{{ canCreateNotif }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ openNotif }}\" style=\"background:#302f39;color:#fff;border:0;border-radius:10px;padding:11px 17px;font-weight:800;font-size:13px;cursor:pointer\">+ Nova notificação<\u002Fbutton><\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"display:grid;gap:10px\">\n    <sc-for list=\"{{ notifList }}\" as=\"n\" hint-placeholder-count=\"3\">\n      <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:12px;padding:14px 16px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n        <div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap\"><strong style=\"font-size:14px\">{{ n.title }}<\u002Fstrong><span style=\"font-size:11.5px;color:#94a3b8\">{{ n.meta }}<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#475467;margin-top:4px\">{{ n.message }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#9a6b56;font-weight:700;margin-top:6px\">{{ n.company }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ noNotif }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding:36px;text-align:center;color:#94a3b8;font-size:14px\">Nenhuma notificação enviada ainda.<\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== AJUDA / DOCUMENTAÇÃO ===================== -->\n<sc-if value=\"{{ show.conta }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease;max-width:560px\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:26px;box-shadow:0 6px 18px rgba(16,35,59,.05)\">\n    <h2 style=\"margin:0 0 16px;font-size:20px\">Minha Conta<\u002Fh2>\n    <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n      <div style=\"position:relative\">\n        <span style=\"width:84px;height:84px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#302f39;color:#fff;font-weight:800;font-size:26px\">{{ avatarBigEl }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:180px\">\n        <div style=\"font-size:18px;font-weight:800\">{{ userName }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:#64748b\">{{ roleLabel }}<\u002Fdiv>\n        <label style=\"display:inline-block;margin-top:10px;background:#302f39;color:#fff;border-radius:9px;padding:8px 13px;font-weight:700;font-size:12.5px;cursor:pointer\">Alterar foto<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onAvatarPick }}\" style=\"display:none\"><\u002Flabel>\n        <sc-if value=\"{{ hasAvatar }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ removeAvatar }}\" style=\"margin-left:8px;background:#fff;color:#b42318;border:1px solid #f3c1bc;border-radius:9px;padding:8px 13px;font-weight:700;font-size:12.5px;cursor:pointer\">Remover<\u002Fbutton><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:12.5px;color:#94a3b8;margin:18px 0 0;line-height:1.5\">A foto fica salva neste dispositivo. Perfis internos do Instituto Államo (Admin, PMO, Techlead).<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== AJUDA / DOCUMENTAÇÃO ===================== -->\n<sc-if value=\"{{ show.ajuda }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease;max-width:900px\">\n  <div style=\"background:linear-gradient(135deg,#302f39,#3d3c48);color:#fff;border-radius:16px;padding:24px 26px;margin-bottom:16px\">\n    <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#b88b78\">Documentação do usuário<\u002Fdiv>\n    <h1 style=\"font-size:26px;margin:8px 0 6px;font-weight:900\">Como usar o Portal PMO<\u002Fh1>\n    <p style=\"opacity:.85;margin:0;font-size:14px;line-height:1.5\">Guia rápido de cada aba e de como editar cada informação. Feito para quem está começando do zero.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;gap:14px\">\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <h2 style=\"font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:9px\"><span style=\"width:26px;height:26px;border-radius:8px;background:#302f39;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800\">1<\u002Fspan>Perfis de acesso<\u002Fh2>\n      <p style=\"font-size:13.5px;color:#475467;line-height:1.6;margin:0\"><strong>Admin<\u002Fstrong> e <strong>PMO<\u002Fstrong> são a equipe interna do Instituto Államo — veem toda a carteira. <strong>Techlead<\u002Fstrong> participa da aprovação de GMUD. O <strong>cliente<\u002Fstrong> não faz login: acessa o painel dele por um <strong>link aberto<\u002Fstrong> que você compartilha.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <h2 style=\"font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:9px\"><span style=\"width:26px;height:26px;border-radius:8px;background:#302f39;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800\">2<\u002Fspan>Empresas<\u002Fh2>\n      <p style=\"font-size:13.5px;color:#475467;line-height:1.6;margin:0 0 6px\"><strong>Criar:<\u002Fstrong> <em>+ Nova empresa<\u002Fem>. <strong>Excluir:<\u002Fstrong> botão <em>Excluir<\u002Fem> no card (remove também os projetos e dados vinculados). Cada empresa pode ter <strong>vários projetos<\u002Fstrong>, listados dentro do card.<\u002Fp>\n      <p style=\"font-size:13.5px;color:#475467;line-height:1.6;margin:0\"><strong>Acompanhar<\u002Fstrong> abre a área do projeto (Status Report). <strong>Abrir →<\u002Fstrong> vai para as demandas.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <h2 style=\"font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:9px\"><span style=\"width:26px;height:26px;border-radius:8px;background:#302f39;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800\">3<\u002Fspan>Projetos<\u002Fh2>\n      <p style=\"font-size:13.5px;color:#475467;line-height:1.6;margin:0\"><strong>Criar:<\u002Fstrong> <em>+ Novo projeto<\u002Fem> (na aba Projetos ou dentro da empresa). <strong>Excluir:<\u002Fstrong> botão <em>Excluir<\u002Fem> no card do projeto (aba Projetos) ou o <em>×<\u002Fem> na lista de projetos dentro do card da empresa. Ao criar um projeto, a <strong>área de acompanhamento é gerada automaticamente<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <h2 style=\"font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:9px\"><span style=\"width:26px;height:26px;border-radius:8px;background:#b88b78;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800\">4<\u002Fspan>Acompanhamento — o que é editável<\u002Fh2>\n      <p style=\"font-size:13.5px;color:#475467;line-height:1.6;margin:0 0 10px\">Abra <em>Acompanhar<\u002Fem> numa empresa e clique em <strong>✎ Editar report<\u002Fstrong>. <u>Tudo é lançado manualmente<\u002Fu> (nada vem automático). No editor você ajusta:<\u002Fp>\n      <div style=\"display:grid;gap:7px\">\n        <div style=\"background:#faf7f4;border:1px solid #ecdfd6;border-radius:9px;padding:10px 12px;font-size:13px;color:#3a3a3a\"><strong>Cronograma (horas por pilar/mês):<\u002Fstrong> cada pilar tem um campo <em>\"horas por mês\"<\u002Fem> — digite os valores separados por vírgula, um por mês (ex.: <code>34, 34, 32, 10, 0<\u002Fcode>). O heatmap é desenhado a partir desses números.<\u002Fdiv>\n        <div style=\"background:#faf7f4;border:1px solid #ecdfd6;border-radius:9px;padding:10px 12px;font-size:13px;color:#3a3a3a\"><strong>Curva S:<\u002Fstrong> preencha <em>Meses<\u002Fem>, <em>Previsto acumulado<\u002Fem> e <em>Realizado acumulado<\u002Fem> — listas separadas por vírgula. Deixe vazio o mês do realizado que ainda não tem dado.<\u002Fdiv>\n        <div style=\"background:#faf7f4;border:1px solid #ecdfd6;border-radius:9px;padding:10px 12px;font-size:13px;color:#3a3a3a\"><strong>Evolução das Horas:<\u002Fstrong> os 4 indicadores (valor e nota) e as barras mensais (mês + horas). A altura da barra usa a meta de horas/mês.<\u002Fdiv>\n        <div style=\"background:#faf7f4;border:1px solid #ecdfd6;border-radius:9px;padding:10px 12px;font-size:13px;color:#3a3a3a\"><strong>Capacidade, Go-Live &amp; Hypercare, Metodologia, Riscos, Próximos passos e TAP:<\u002Fstrong> todos com campos próprios (texto, datas e situação por seletor).<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px;color:#475467;line-height:1.6;margin:12px 0 0\"><strong>Compartilhar:<\u002Fstrong> <em>⧉ Copiar link<\u002Fem> ou <em>WhatsApp<\u002Fem>. O link abre <strong>sem login<\u002Fstrong> e mostra só os dados daquela empresa.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <h2 style=\"font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:9px\"><span style=\"width:26px;height:26px;border-radius:8px;background:#302f39;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800\">5<\u002Fspan>GMUD (Gestão de Mudanças)<\u002Fh2>\n      <p style=\"font-size:13.5px;color:#475467;line-height:1.6;margin:0\"><strong>Criar:<\u002Fstrong> <em>+ Nova GMUD<\u002Fem> — título, empresa, <strong>projetos afetados<\u002Fstrong>, tipo, risco, janela e rollback. <strong>Aprovação em duas etapas:<\u002Fstrong> <em>Aprovar (PMO)<\u002Fem> e <em>Aprovar (Techlead)<\u002Fem>. Só vira <strong>Aprovada<\u002Fstrong> com as duas. Aprovada, o cliente recebe no painel a <strong>data e as mudanças<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <h2 style=\"font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:9px\"><span style=\"width:26px;height:26px;border-radius:8px;background:#302f39;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800\">6<\u002Fspan>Demandas &amp; Linear<\u002Fh2>\n      <p style=\"font-size:13.5px;color:#475467;line-height:1.6;margin:0 0 10px\"><strong>↻ Sincronizar Linear<\u002Fstrong> traz as demandas (somente leitura — nada muda no Linear). Story Points viram horas e labels viram tipos. Roda também automaticamente todo dia.<\u002Fp>\n      <div style=\"background:#faf7f4;border:1px solid #ecdfd6;border-radius:9px;padding:12px 14px;font-size:13px;color:#3a3a3a;line-height:1.6\">\n        <strong>Como vincular um projeto do painel ao Linear (passo a passo):<\u002Fstrong>\n        <div style=\"margin-top:6px\">1. No Linear, o nome do <strong>Team<\u002Fstrong> (ou do Project) precisa bater com o nome da <strong>empresa<\u002Fstrong> cadastrada aqui — ex.: empresa \"Centersport\" ↔ Team \"Centersport\".<br>\n        2. A vinculação é pelo <strong>nome<\u002Fstrong> (ignora maiúsculas/acentos). Se não casar, a demanda entra \"sem empresa\".<br>\n        3. Cadastre a empresa aqui primeiro, com o mesmo nome do Team no Linear.<br>\n        4. Clique em <strong>↻ Sincronizar Linear<\u002Fstrong> na aba Demandas. As issues daquele workspace aparecem já ligadas à empresa.<br>\n        5. Cada workspace do Linear precisa da própria chave (secret <code>LINEAR_API_KEY<\u002Fcode>, <code>_2<\u002Fcode>, <code>_3<\u002Fcode>…). Novos workspaces = nova chave nos secrets da Cloudflare.<br>\n        6. Os projetos que você cria aqui no painel são de acompanhamento (report/GMUD); as <em>demandas<\u002Fem> continuam vindo do Linear pela sincronização.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <h2 style=\"font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:9px\"><span style=\"width:26px;height:26px;border-radius:8px;background:#302f39;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800\">7<\u002Fspan>E-mail da GMUD<\u002Fh2>\n      <p style=\"font-size:13.5px;color:#475467;line-height:1.6;margin:0\">Ao criar/aprovar uma GMUD, o sistema envia e-mail para o <strong>e-mail do responsável<\u002Fstrong> cadastrado na empresa (edite a empresa para preencher). Importante: com o Resend em modo de teste, o e-mail só é entregue ao endereço verificado da conta; para enviar a qualquer destinatário é preciso <strong>verificar um domínio<\u002Fstrong> no Resend. Todo envio fica registrado no sistema (outbox), mesmo que o provedor não entregue.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <h2 style=\"font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:9px\"><span style=\"width:26px;height:26px;border-radius:8px;background:#302f39;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800\">7<\u002Fspan>Acessos, Histórico e Assistente<\u002Fh2>\n      <p style=\"font-size:13.5px;color:#475467;line-height:1.6;margin:0\"><strong>Acessos<\u002Fstrong> (só Admin): criar/editar usuários internos. <strong>Histórico<\u002Fstrong>: registro de tudo. <strong>Assistente<\u002Fstrong> (balão ✦): pergunte sobre status, demandas e GMUD.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#eef4fb;border:1px solid #cfe0f5;border-radius:12px;padding:14px 16px;font-size:13px;color:#1c4a7d;line-height:1.6\"><strong>Dica:<\u002Fstrong> o <span style=\"display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#1c4a7d;color:#fff;font-size:10px;vertical-align:middle\">?<\u002Fspan> ao lado de \"Portal PMO\" (topo) explica a aba atual.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n<!-- ===================== ÁREA DO PROJETO · STATUS REPORT ===================== -->\n<sc-if value=\"{{ show.acompanhamento }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp .3s ease\">\n  <div style=\"background:linear-gradient(135deg,#302f39,#3d3c48);color:#fff;border-radius:18px;padding:26px 28px;margin-bottom:16px;position:relative;overflow:hidden\">\n    <div style=\"position:absolute;top:-40%;right:-6%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(184,139,120,.28),transparent 65%)\"><\u002Fdiv>\n    <div style=\"position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap\">\n      <div>\n        <div style=\"letter-spacing:.16em;text-transform:uppercase;font-size:11px;font-weight:800;color:#b88b78\">Área do Projeto · Status Report<\u002Fdiv>\n        <h1 style=\"font-size:clamp(22px,2.6vw,32px);margin:8px 0 6px;font-weight:800\">{{ rep.title }}<\u002Fh1>\n        <div style=\"opacity:.82;font-size:13.5px\">{{ rep.client }} · Referência {{ rep.ref }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ repHasProjects }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap\">\n          <label style=\"font-size:11px;font-weight:700;color:#b88b78;text-transform:uppercase;letter-spacing:.08em\">Projeto<sc-raw-select sc-camel-on-change=\"{{ onReportChange }}\" style=\"display:block;margin-top:6px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:9px 12px;font-weight:700;font-size:13px\"><sc-for list=\"{{ reportOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\" selected=\"{{ o.sel }}\" style=\"color:#10233b;background:#fff\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n          <button sc-camel-on-click=\"{{ openReportEditor }}\" style=\"background:#b88b78;color:#fff;border:0;border-radius:9px;padding:10px 15px;font-weight:800;font-size:13px;cursor:pointer\" style-hover=\"background:#a67867\">✎ Editar report<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-top:14px\">\n      <button sc-camel-on-click=\"{{ copyLink }}\" style=\"background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:9px 14px;font-weight:700;font-size:12.5px;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.24)\">{{ copyLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ shareWhats }}\" style=\"background:#25d366;color:#0b3d24;border:0;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12.5px;cursor:pointer\" style-hover=\"background:#20c25d\">Compartilhar no WhatsApp<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasChanges }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff7ed;border:1px solid #f3d3a7;border-left:5px solid #d69e2e;border-radius:14px;padding:16px 18px;margin-bottom:16px\">\n    <div style=\"font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#9a6b1a;margin-bottom:10px\">Mudanças programadas (GMUD)<\u002Fdiv>\n    <div style=\"display:grid;gap:10px\">\n      <sc-for list=\"{{ clientChanges }}\" as=\"c\" hint-placeholder-count=\"2\">\n        <div style=\"background:#fff;border:1px solid #f0e2cd;border-radius:10px;padding:12px 14px\">\n          <div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap\"><strong style=\"font-size:14px\">{{ c.title }}<\u002Fstrong><span style=\"font-size:12px;font-weight:800;color:#9a6b1a\">{{ c.window }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#6b5a3a;margin-top:3px\">{{ c.info }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Documentos do report/projeto/empresa -->\n  <sc-if value=\"{{ canManage }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n      <div style=\"font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#52514e\">Documentos &amp; anexos<\u002Fdiv>\n      <sc-if value=\"{{ canManage }}\" hint-placeholder-val=\"{{ false }}\">\n        <label style=\"background:#302f39;color:#fff;border-radius:9px;padding:8px 13px;font-weight:700;font-size:12.5px;cursor:pointer\">+ Anexar arquivo<input type=\"file\" sc-camel-on-change=\"{{ onDocPick }}\" style=\"display:none\"><\u002Flabel>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:8px;margin-top:12px\">\n      <sc-for list=\"{{ docList }}\" as=\"d\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#fafcff;border:1px solid #eef1f4;border-radius:9px;padding:9px 12px\">\n          <span style=\"width:30px;height:30px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;background:#9a6b56\">{{ d.ext }}<\u002Fspan>\n          <div style=\"flex:1;min-width:0\"><div style=\"font-size:13px;font-weight:700;overflow-wrap:anywhere\">{{ d.name }}<\u002Fdiv><div style=\"font-size:11px;color:#94a3b8\">{{ d.meta }}<\u002Fdiv><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ d.download }}\" style=\"background:none;border:0;color:#2563a8;font-weight:700;font-size:12.5px;cursor:pointer\">Baixar<\u002Fbutton>\n          <sc-if value=\"{{ d.canDelete }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ d.del }}\" style=\"background:none;border:0;color:#b42318;font-weight:800;font-size:14px;cursor:pointer\">×<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ noDocs2 }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:12.5px;color:#94a3b8;padding:6px 2px\">Nenhum documento anexado ainda. Máximo ~1 MB por arquivo.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Atualizações do gestor -->\n  <sc-if value=\"{{ canManage }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n    <div style=\"font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#52514e;margin-bottom:10px\">Atualizações do projeto (gestor → PMO)<\u002Fdiv>\n    <div style=\"display:grid;gap:8px\">\n      <input sc-camel-on-input=\"{{ onUpdAuthor }}\" value=\"{{ updAuthor }}\" placeholder=\"Seu nome\" style=\"padding:10px 12px;border:1px solid #d0d5dd;border-radius:9px;font-size:13.5px\">\n      <textarea sc-camel-on-input=\"{{ onUpdMessage }}\" value=\"{{ updMessage }}\" rows=\"3\" placeholder=\"Escreva a atualização do projeto (avanços, pendências, prazos)…\" style=\"padding:10px 12px;border:1px solid #d0d5dd;border-radius:9px;font-size:13.5px;resize:vertical\"><\u002Ftextarea>\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <button sc-camel-on-click=\"{{ sendUpdate }}\" style=\"background:#302f39;color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer\">Enviar atualização<\u002Fbutton>\n        <sc-if value=\"{{ updSent }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12.5px;color:#16865c;font-weight:700\">✓ Enviada ao PMO<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasUpdates }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:14px;display:grid;gap:8px\">\n        <sc-for list=\"{{ updateList }}\" as=\"u\" hint-placeholder-count=\"2\">\n          <div style=\"background:#fafcff;border:1px solid #eef1f4;border-radius:9px;padding:10px 12px\">\n            <div style=\"font-size:12px;color:#94a3b8;font-weight:700\">{{ u.author }} · {{ u.when }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#3a3a3a;margin-top:3px;white-space:pre-wrap\">{{ u.message }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- sub-abas numeradas -->\n  <div style=\"display:flex;gap:4px;border-bottom:1px solid #e6ebf2;margin-bottom:18px;overflow:auto\">\n    <sc-for list=\"{{ repTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\"><span style=\"{{ t.numStyle }}\">{{ t.num }}<\u002Fspan>{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- ST1 · Visão Geral -->\n  <sc-if value=\"{{ repShow.geral }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#52514e;margin-bottom:12px;display:flex;align-items:center;gap:9px\"><span style=\"width:4px;height:15px;background:#b88b78;border-radius:2px\"><\u002Fspan>Pilares do projeto <button sc-camel-on-click=\"{{ edPillars }}\" title=\"Editar\" style=\"background:none;border:0;cursor:pointer;color:#b88b78;font-size:13px;margin-left:4px\">✎<\u002Fbutton><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin-bottom:24px\">\n      <sc-for list=\"{{ rep.pillars }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"background:linear-gradient(160deg,#302f39,#3d3c48);border-radius:14px;padding:17px 16px;color:#fff;border-top:3px solid #b88b78;position:relative;overflow:hidden\">\n          <div style=\"position:absolute;top:10px;right:14px;font-size:32px;font-weight:800;color:rgba(184,139,120,.30);line-height:1\">{{ p.num }}<\u002Fdiv>\n          <h4 style=\"font-size:14px;font-weight:700;line-height:1.25;margin:0 26px 8px 0\">{{ p.name }}<\u002Fh4>\n          <p style=\"font-size:11.7px;color:#cfcdc6;line-height:1.42;margin:0\">{{ p.desc }}<\u002Fp>\n          <div style=\"margin-top:11px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#b88b78;border-top:1px solid rgba(255,255,255,.12);padding-top:9px\">{{ p.tag }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#52514e;margin-bottom:12px;display:flex;align-items:center;gap:9px\"><span style=\"width:4px;height:15px;background:#b88b78;border-radius:2px\"><\u002Fspan>Painel de situação <button sc-camel-on-click=\"{{ edSemaf }}\" title=\"Editar\" style=\"background:none;border:0;cursor:pointer;color:#b88b78;font-size:13px;margin-left:4px\">✎<\u002Fbutton><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px\">\n      <sc-for list=\"{{ rep.semaphores }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:16px;position:relative;overflow:hidden;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n          <span style=\"position:absolute;left:0;top:0;bottom:0;width:4px;background:{{ s.color }}\"><\u002Fspan>\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#898781\">{{ s.label }}<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:800;margin-top:8px;display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ s.color }}\"><\u002Fspan>{{ s.state }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#52514e;margin-top:6px;line-height:1.45\">{{ s.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#52514e;margin:24px 0 12px;display:flex;align-items:center;gap:9px\"><span style=\"width:4px;height:15px;background:#b88b78;border-radius:2px\"><\u002Fspan>Cronograma sugerido (horas por pilar / mês) <button sc-camel-on-click=\"{{ edCronoBtn }}\" title=\"Editar\" style=\"background:none;border:0;cursor:pointer;color:#b88b78;font-size:13px;margin-left:4px\">✎<\u002Fbutton><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:16px 18px;box-shadow:0 5px 16px rgba(29,41,57,.04);overflow:auto\">\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:11.5px;min-width:720px\">\n        <sc-raw-thead><sc-raw-tr>\n          <sc-raw-th style=\"text-align:left;min-width:190px;padding:5px 6px;color:#898781;font-weight:600\">Pilar<\u002Fsc-raw-th>\n          <sc-for list=\"{{ rep.cronoHead }}\" as=\"h\" hint-placeholder-count=\"13\"><sc-raw-th style=\"padding:5px 4px;color:#898781;font-weight:600;text-align:center\">{{ h.m }}<\u002Fsc-raw-th><\u002Fsc-for>\n        <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ rep.cronoRows }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:4px 6px;font-size:12.5px;font-weight:600;color:#141414\">{{ p.name }}<span style=\"display:block;color:#898781;font-weight:400;font-size:10.5px\">{{ p.sub }} · {{ p.total }}h<\u002Fspan><\u002Fsc-raw-td>\n              <sc-for list=\"{{ p.cells }}\" as=\"c\" hint-placeholder-count=\"13\"><sc-raw-td style=\"padding:3px 2px\"><div style=\"{{ c.style }}\">{{ c.v }}<\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-for>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ST2 · Escopo -->\n  <sc-if value=\"{{ repShow.escopo }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px;margin-bottom:22px\">\n      <sc-for list=\"{{ rep.kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:16px 18px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n          <div style=\"font-size:12px;color:#898781;font-weight:600\">{{ k.label }}<\u002Fdiv>\n          <div style=\"font-size:28px;font-weight:800;margin-top:6px\">{{ k.value }}<span style=\"font-size:14px;color:#898781;font-weight:600\">{{ k.unit }}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12px;color:#52514e;margin-top:3px\">{{ k.note }}<\u002Fdiv>\n          <div style=\"height:6px;background:#e6e5df;border-radius:4px;margin-top:11px;overflow:hidden\"><i style=\"display:block;height:100%;border-radius:4px;width:{{ k.pct }};background:#2a78d6\"><\u002Fi><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#52514e;margin-bottom:12px;display:flex;align-items:center;gap:9px\"><span style=\"width:4px;height:15px;background:#b88b78;border-radius:2px\"><\u002Fspan>Entregas por módulo<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:22px\">\n      <sc-for list=\"{{ rep.modules }}\" as=\"m\" hint-placeholder-count=\"6\">\n        <div style=\"background:#fcfcfb;border:1px solid #e6e5df;border-radius:10px;padding:13px 14px\">\n          <div style=\"font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px\"><span style=\"color:#0ca30c;font-weight:700\">✓<\u002Fspan>{{ m.name }}<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#52514e;margin-top:5px;line-height:1.4\">{{ m.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#52514e;margin-bottom:12px;display:flex;align-items:center;gap:9px\"><span style=\"width:4px;height:15px;background:#b88b78;border-radius:2px\"><\u002Fspan>Marcos e fases<\u002Fdiv>\n    <div style=\"display:grid;gap:16px\">\n      <sc-for list=\"{{ rep.phases }}\" as=\"f\" hint-placeholder-count=\"2\">\n        <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:16px 18px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n          <div style=\"font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px\">{{ f.title }}<span style=\"margin-left:auto;font-size:11.5px;font-weight:600;color:#898781\">{{ f.pct }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;gap:6px\">\n            <sc-for list=\"{{ f.items }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"border:1px solid #e6e5df;border-radius:9px;background:#fcfcfb;overflow:hidden\">\n                <button sc-camel-on-click=\"{{ m.toggle }}\" style=\"width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;background:none;border:0;cursor:pointer;text-align:left\">\n                  <span style=\"width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:{{ m.icColor }}\">{{ m.icon }}<\u002Fspan>\n                  <span style=\"font-size:13px;flex:1\">{{ m.name }}<\u002Fspan>\n                  <span style=\"{{ m.tagStyle }}\">{{ m.tag }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#898781\">{{ m.caret }}<\u002Fspan>\n                <\u002Fbutton>\n                <sc-if value=\"{{ m.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:4px 12px 12px 42px;display:grid;gap:5px\">\n                    <sc-for list=\"{{ m.demandas }}\" as=\"d\" hint-placeholder-count=\"2\">\n                      <div s px solid #e6e5df\">\n          <span style=\"width:8px;flex:none;border-radius:4px;background:{{ r.color }}\"><\u002Fspan>\n          <div style=\"flex:1\"><div style=\"font-size:14px;font-weight:700\">{{ r.title }}<\u002Fdiv><div style=\"font-size:12.5px;color:#52514e;margin-top:3px\">{{ r.desc }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;color:#898781;white-space:nowrap;flex:none\">{{ r.meta }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#52514e;margin-bottom:12px;display:flex;align-items:center;gap:9px\"><span style=\"width:4px;height:15px;background:#b88b78;border-radius:2px\"><\u002Fspan>Alertas<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px\">\n      <sc-for list=\"{{ rep.alerts }}\" as=\"a\" hint-placeholder-count=\"2\">\n        <div style=\"background:#fff;border:1px solid #e6ebf2;border-left:4px solid {{ a.color }};border-radius:12px;padding:14px 16px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n          <div style=\"font-size:11px;font-weight:800;text-transform:uppercase;color:{{ a.color }}\">{{ a.level }}<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:700;margin-top:4px\">{{ a.title }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#52514e;margin-top:4px\">{{ a.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Curva S -->\n  <sc-if value=\"{{ repShow.curva }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <div style=\"background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(29,41,57,.04)\">\n      <div style=\"font-size:14px;font-weight:700;margin-bottom:4px\">Curva S — horas acumuladas<\u002Fdiv>\n      <div style=\"font-size:12px;color:#898781;margin-bottom:16px\">Previsto (contrato) × Realizado<\u laceholder-count=\"5\"><option value=\"{{ o.id }}\" selected=\"{{ o.selU }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n      <\u002Fdiv>\n      <label style=\"font-size:12.5px;font-weight:700;color:#475467\">Senha inicial *<input sc-camel-on-input=\"{{ uf.password }}\" value=\"{{ ufv.password }}\" type=\"text\" placeholder=\"o usuário troca depois\" style=\"display:block;width:100%;margin-top:5px;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font-size:14px\"><\u002Flabel>\n      <sc-if value=\"{{ hasFormError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;color:#b42318;font-weight:700\">{{ formError }}<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;justify-content:flex-end;margin-top:20px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ closeModal }}\" style=\"background:#fff;border:1px solid #d0d5dd;border-radius:10px;padding:11px 17px;font-weight:700;font-size:13px;cursor:pointer\">Cancelar<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ submitUser }}\" style=\"background:#302f39;color:#fff;border:0;border-radius:10px;padding:11px 19px;font-weight:800;font-size:13px;cursor:pointer\">{{ saveLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fform>\n<\u002Fdiv>\n<\u002Fsc-if>\n<!-- ===================== MODAL: EDITAR STATUS REPORT ===================== -->\n<sc-if value=\"{{ modalReport }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;z-index:80;background:rgba(11,35,64,.45);display:grid;place-items:center;padding:20px\">\n  <form sc-camel-on-click=\"{{ stop }}\" sc-camel-on-submit=\"{{ submitReport }}\" style=\"width:min(640px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 30px 70px rgba(11,35,64,.35)\">\n    <h2 style=\"margin:0 0 4px;font-size:20px\">Editar Status Report<\u002Fh2>\n    <p style=\"color:#64748b;font-size:13px;margin:0 0 18px\">Ajuste os dados que o cliente vê na área do projeto. As alterações ficam no histórico.<\u002Fp>\n    <div style=\"display:grid;gap:14px\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n        <label style=\"font-size:12.5px;font-weight:700;color:#475467\">Mês de referência<input sc-camel-on-input=\"{{ rf.ref }}\" value=\"{{ rfv.ref }}\" style=\"display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #d0d5dd;border-radius:10px;font-size:14px\"><\u002Flabel>\n        <label style=\"font-size:12.5px;font-weight:700;color:#475467\">Meta de horas/mês<input sc-camel-on-input=\"{{ rf.hoursMeta }}\" value=\"{{ rfv.hoursMeta }}\" style=\"display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #d0d5dd;border-radius:10px;font-size:14px\"><\u002Flabel>\n      <\u002Fdiv>\n      <div data-ed=\"sec-kpis\" style=\"font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#52514e;margin-top:4px\">Indicadores (escopo)<\u002Fdiv>\n      <sc-for list=\"{{ rfKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:1.4fr .7fr 1fr;gap:8px;align-items:end\">\n          <label style=\"font-size:11.5px;font-weight:700;color:#475467\">{{ k.label }}<input sc-camel-on-input=\"{{ k.onValue }}\" value=\"{{ k.value }}\" style=\"display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\"><\u002Flabel>\n          <label style=\"font-size:11.5px;font-weight:700;color:#475467\">Unid.<input sc-camel-on-input=\"{{ k.onUnit }}\" value=\"{{ k.unit }}\" style=\"display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\"><\u002Flabel>\n          <label style=\"font-size:11.5px;font-weight:700;color:#475467\">Nota<input sc-camel-on-input=\"{{ k.onNote }}\" value=\"{{ k.note }}\" style=\"display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\"><\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#52514e;margin-top:4px\">Riscos<\u002Fdiv>\n      <sc-for list=\"{{ rfRisks }}\" as=\"r\" hint-placeholder-count=\"2\">\n        <div style=\"display:grid;gap:6px;border:1px solid #eef1f4;border-radius:10px;padding:10px\">\n          <input sc-camel-on-input=\"{{ r.onTitle }}\" value=\"{{ r.title }}\" placeholder=\"Título do risco\" style=\"padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px;font-weight:600\">\n          <input sc-camel-on-input=\"{{ r.onDesc }}\" value=\"{{ r.desc }}\" placeholder=\"Descrição\" style=\"padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#52514e;margin-top:4px\">Próximos 30 dias<\u002Fdiv>\n      <sc-for list=\"{{ rfNext }}\" as=\"n\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:1fr 1.6fr;gap:8px\">\n          <input sc-camel-on-input=\"{{ n.onTitle }}\" value=\"{{ n.title }}\" placeholder=\"Ação\" style=\"padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px;font-weight:600\">\n          <input sc-camel-on-input=\"{{ n.onDesc }}\" value=\"{{ n.desc }}\" placeholder=\"Detalhe\" style=\"padding:9px;border:1px solid #d0d5dd;border-radius:9px;font-size:13px\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#52514e;margin-top:8px;border-top:1px solid #eef1f4;padding-top:14px\">TAP — Termo de Abertura<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n        <label style=\"font-size:11.5px;font-weight:700;color:#475467\">Data de kickoff<input sc-camel-on-input=
