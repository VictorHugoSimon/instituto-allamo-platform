name: Operational Health - Stage + Production

on:
  schedule:
    - cron: '5 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: allamo-operational-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Smoke operacional somente leitura
        run: node scripts/operational-health-check.mjs
        env:
          ALLAMO_STAGE_URL: https://allamo-pmo-stage.pages.dev
          ALLAMO_PRODUCTION_URL: https://allamo-pmo.pages.dev

      - name: Fechar alerta anterior após recuperação
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue="$(gh issue list --state open --search '"[OPS] Saúde operacional indisponível" in:title' --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "Recuperado automaticamente em $(date -u +'%Y-%m-%d %H:%M UTC'). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$issue" --reason completed
          fi

      - name: Abrir ou atualizar alerta operacional
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='[OPS] Saúde operacional indisponível'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue="$(gh issue list --state open --search '"[OPS] Saúde operacional indisponível" in:title' --json number --jq '.[0].number // empty')"
          body="Monitoramento read-only detectou falha em Stage e/ou Produção em $(date -u +'%Y-%m-%d %H:%M UTC'). Nenhuma escrita ou exclusão foi executada. Verifique o run: ${run_url}"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Resumo
        if: always()
        run: |
          echo '### Saúde operacional Államo PMO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Stage: release, empresas, projetos, tenants públicos e persistência' >> "$GITHUB_STEP_SUMMARY"
          echo '- Produção: release, empresas, projetos e tenants públicos' >> "$GITHUB_STEP_SUMMARY"
          echo '- Teste: somente leitura; nenhuma mutação de dados' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frequência: a cada 2 horas' >> "$GITHUB_STEP_SUMMARY"
          echo '- Falha: abre/atualiza uma única issue operacional; recuperação fecha o alerta' >> "$GITHUB_STEP_SUMMARY"
