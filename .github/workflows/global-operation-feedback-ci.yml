name: Global Operation Feedback CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  global-operation-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build final portal artifact
        run: npm run build:work
      - name: Validate global operation feedback
        run: node scripts/validate-global-operation-feedback.mjs
      - name: Validate responsive usability
        run: npm run test:ux
      - name: Validate bundle integrity
        run: npm run test:bundle
