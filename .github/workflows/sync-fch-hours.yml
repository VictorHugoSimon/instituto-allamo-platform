name: '[LEGACY MANUAL] Sync FCH Hours to PMO'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fch-hours-sync-legacy
  cancel-in-progress: true

jobs:
  legacy-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Rotina legada desativada
        run: |
          echo '### Rotina FCH legada' >> "$GITHUB_STEP_SUMMARY"
          echo '- O agendamento e a gravação automática foram removidos deste fluxo.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Motivo: havia três rotinas FCH concorrentes executando a cada hora.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Rotina oficial: `FCH Sync Oficial - Curva S` (`sync-fch-curve-detailed.yml`).' >> "$GITHUB_STEP_SUMMARY"
          echo '- Este workflow permanece apenas para rastreabilidade e não altera Stage ou Produção.' >> "$GITHUB_STEP_SUMMARY"
