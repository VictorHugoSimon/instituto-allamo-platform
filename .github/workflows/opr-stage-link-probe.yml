name: OPR Stage Link Probe

on:
  push:
    branches: [ops/opr-link-probe-20260830]

permissions:
  contents: read

jobs:
  generate-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve OPR project and publish report
        run: |
          node <<'NODE'
          const base='https://allamo-pmo-stage.pages.dev';
          async function call(path,opt={}){
            const r=await fetch(base+path,{...opt,headers:{'content-type':'application/json','cache-control':'no-cache',...(opt.headers||{})},cache:'no-store'});
            const text=await r.text();
            let data; try{data=JSON.parse(text)}catch{data=text}
            if(!r.ok) throw new Error(`${path} -> HTTP ${r.status}: ${text.slice(0,500)}`);
            return data;
          }
          const projects=await call('/api/opr-projects');
          if(!Array.isArray(projects)||!projects.length) throw new Error('Nenhum projeto OPR encontrado.');
          const p=projects[0];
          const published=await call('/api/opr-report-publish',{method:'POST',body:JSON.stringify({project_id:Number(p.id)})});
          const plan=`${base}/?module=opr-plan&project=${encodeURIComponent(p.id)}`;
          const lines=[`PROJECT_ID=${p.id}`,`PROJECT_NAME=${p.name}`,`PLAN_LINK=${plan}`,`REPORT_LINK=${published.public_url}`];
          console.log(lines.join('\n'));
          require('node:fs').writeFileSync('opr-links.txt',lines.join('\n')+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: opr-stage-links
          path: opr-links.txt
          if-no-files-found: error
          retention-days: 1
