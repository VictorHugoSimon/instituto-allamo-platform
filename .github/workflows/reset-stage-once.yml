name: Reset controlado do STAGE

on:
  push:
    branches: [develop]
    paths:
      - 'migrations/2026-08-21-reset-stage.sql'
      - '.github/workflows/reset-stage-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset-allamo-pmo-stage
  cancel-in-progress: false

jobs:
  reset-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backup D1 STAGE antes do reset
        run: npx wrangler@4.124.0 d1 export DB --env production --remote --output=stage-before-reset.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Guardar backup como artefato
        uses: actions/upload-artifact@v4
        with:
          name: stage-d1-before-reset-${{ github.run_id }}
          path: stage-before-reset.sql
          retention-days: 30

      - name: Executar reset somente no D1 do STAGE
        run: npx wrangler@4.124.0 d1 execute DB --env production --remote --file=./migrations/2026-08-21-reset-stage.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validar contadores zerados
        run: |
          npx wrangler@4.124.0 d1 execute DB --env production --remote --command="SELECT (SELECT COUNT(*) FROM companies) AS companies, (SELECT COUNT(*) FROM projects) AS projects, (SELECT COUNT(*) FROM issues) AS issues, (SELECT COUNT(*) FROM work_items) AS work_items, (SELECT COUNT(*) FROM plan_items) AS plan_items;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
