name: '[LEGACY MANUAL] FCH Hours Sync - OPR e MADRI'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allamo-fch-hours-sync-legacy
  cancel-in-progress: true

jobs:
  legacy-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Rotina legada desativada
        run: |
          echo '### Rotina FCH legada' >> "$GITHUB_STEP_SUMMARY"
          echo '- O agendamento automático foi removido para evitar concorrência e dupla carga.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Rotina oficial: `FCH Sync Oficial - Curva S` (`sync-fch-curve-detailed.yml`).' >> "$GITHUB_STEP_SUMMARY"
          echo '- Este workflow permanece apenas como referência/manual e não grava dados.' >> "$GITHUB_STEP_SUMMARY"
