name: Deploy STAGE to Cloudflare Pages

on:
  push:
    branches: [develop]
    paths:
      - 'public/**'
      - 'src/work-management-*.js'
      - 'scripts/build-work-management.mjs'
      - 'migrations/2026-08-21-work-management.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allamo-pmo-stage
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native Work Management
        run: npm run build:work

      - name: Validate generated Worker
        run: |
          node --check public/_worker.js
          grep -q "BEGIN ALLAMO WORK MANAGEMENT" public/_worker.js
          grep -q "BEGIN ALLAMO WORK MANAGEMENT UI" public/index.html

      - name: Apply idempotent Work Management migration to STAGE D1
        run: npx wrangler@4.124.0 d1 execute DB --env production --remote --file=./migrations/2026-08-21-work-management.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages STAGE
        run: npx wrangler@4.124.0 pages deploy public --project-name allamo-pmo-stage --branch production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
