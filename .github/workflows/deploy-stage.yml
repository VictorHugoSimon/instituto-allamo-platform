name: Deploy STAGE to Cloudflare Pages

on:
  push:
    branches: [develop]
    paths:
      - 'public/**'
      - 'src/work-management-*.js'
      - 'src/stage-runtime-bootstrap.js'
      - 'src/portal-enhancements.js'
      - 'scripts/build-work-management.mjs'
      - 'scripts/harden-portal-runtime.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allamo-pmo-stage
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portal + Work Management
        run: npm run build:work

      - name: Validate generated portal
        run: |
          node --check public/_worker.js
          node --check public/sw.js
          grep -q "BEGIN ALLAMO STAGE RUNTIME" public/_worker.js
          grep -q "BEGIN ALLAMO WORK MANAGEMENT" public/_worker.js
          grep -q "BEGIN ALLAMO WORK MANAGEMENT UI" public/index.html
          grep -q "data-allamo-work-menu" public/index.html
          grep -q "data-allamo-company-kpi" public/index.html
          grep -q "allamo-boot-guard" public/index.html

      # IMPORTANTE: não executar D1 com --env production no pipeline de STAGE.
      # O bootstrap runtime usa exatamente o binding DB do projeto allamo-pmo-stage
      # e aplica schema/reset uma única vez, somente no hostname de homologação.
      # Redeploy forçado após validação completa do pacote de homologação.
      - name: Deploy to Cloudflare Pages STAGE
        run: npx wrangler@4.124.0 pages deploy public --project-name allamo-pmo-stage --branch production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
