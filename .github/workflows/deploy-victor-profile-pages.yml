name: Deploy Victor Hugo Perfil Profissional

on:
  push:
    branches:
      - ops/victor-profile-pages
    paths:
      - .github/workflows/deploy-victor-profile-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_PROJECT_NAME: victor-hugo-teixeira-simon
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout do site profissional
        uses: actions/checkout@v4
        with:
          repository: VictorHugoSimon/victor-simon-site
          ref: main
          path: profile

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: profile/package-lock.json

      - name: Instalar dependências
        working-directory: profile
        run: npm ci

      - name: Validar projeto
        working-directory: profile
        run: npm run ci

      - name: Preparar build provisório Cloudflare Pages
        working-directory: profile
        env:
          API_BASE: https://api.example.invalid
        run: npm run build:production

      - name: Validar autenticação Cloudflare
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@4.124.0 whoami

      - name: Garantir projeto Cloudflare Pages
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const name = process.env.PAGES_PROJECT_NAME;
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          const current = await fetch(`${base}/pages/projects/${encodeURIComponent(name)}`, { headers });
          if (current.status === 404) {
            const created = await fetch(`${base}/pages/projects`, {
              method: 'POST', headers,
              body: JSON.stringify({ name, production_branch: 'main' })
            });
            const data = await created.json();
            if (!created.ok || data.success === false) throw new Error(JSON.stringify(data.errors || data));
            console.log(`Pages criado: ${name}`);
          } else {
            const data = await current.json();
            if (!current.ok || data.success === false) throw new Error(JSON.stringify(data.errors || data));
            console.log(`Pages existente: ${name}`);
          }
          NODE

      - name: Publicar perfil profissional
        working-directory: profile
        run: npx wrangler@4.124.0 pages deploy dist --project-name="$PAGES_PROJECT_NAME" --branch=main --commit-dirty=true

      - name: Smoke test público
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://victor-hugo-teixeira-simon.pages.dev/';
          let ok = false;
          for (let i = 0; i < 8; i++) {
            const r = await fetch(url, { redirect: 'follow' }).catch(() => null);
            if (r?.ok) {
              const html = await r.text();
              if (/Victor Hugo/i.test(html)) { ok = true; break; }
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!ok) throw new Error('Site não respondeu corretamente no endereço canônico.');
          console.log(`OK: ${url}`);
          NODE

      - name: Resumo
        if: always()
        run: |
          echo "### Victor Hugo — Perfil Profissional" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL provisória: https://victor-hugo-teixeira-simon.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fonte: VictorHugoSimon/victor-simon-site@main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publicação: Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
