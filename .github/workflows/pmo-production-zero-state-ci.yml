name: PMO Zero-State Policy CI

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/deploy-stage.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/operational-health.yml'
      - '.github/workflows/madri-pmo-stage-schema.yml'
      - '.github/workflows/madri-current-stage-crud-verification.yml'
      - 'scripts/operational-health-check.mjs'
      - 'scripts/validate-operational-health.mjs'
      - 'scripts/smoke-governance-environment.mjs'
      - 'scripts/smoke-stage-data-integrity.mjs'
      - 'scripts/validate-governance-release.mjs'
      - 'scripts/validate-d1-environment-isolation.mjs'
      - '.github/workflows/pmo-production-zero-state-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/deploy-stage.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/operational-health.yml'
      - '.github/workflows/madri-pmo-stage-schema.yml'
      - '.github/workflows/madri-current-stage-crud-verification.yml'
      - 'scripts/operational-health-check.mjs'
      - 'scripts/validate-operational-health.mjs'
      - 'scripts/smoke-governance-environment.mjs'
      - 'scripts/smoke-stage-data-integrity.mjs'
      - 'scripts/validate-governance-release.mjs'
      - 'scripts/validate-d1-environment-isolation.mjs'
      - '.github/workflows/pmo-production-zero-state-ci.yml'

permissions:
  contents: read

jobs:
  policy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências travadas
        run: npm ci
      - name: Gerar artefato pelo build oficial
        run: npm run build:work
      - name: Validar governança da release
        run: node scripts/validate-governance-release.mjs
      - name: Validar isolamento Stage/Produção
        run: node scripts/validate-d1-environment-isolation.mjs
      - name: Validar Operational Health read-only e compatível com estado zero
        run: node scripts/validate-operational-health.mjs
      - name: Validar ausência de provisionamento automático de dados de negócio
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const stage=fs.readFileSync('.github/workflows/deploy-stage.yml','utf8');
          const prod=fs.readFileSync('.github/workflows/deploy-production.yml','utf8');
          const health=fs.readFileSync('scripts/operational-health-check.mjs','utf8');
          const madriSeed=fs.readFileSync('.github/workflows/madri-pmo-stage-schema.yml','utf8');
          const madriCrud=fs.readFileSync('.github/workflows/madri-current-stage-crud-verification.yml','utf8');

          const forbiddenStage=[
            'repair-core-tenants-portable.mjs --env=stage',
            'REPAIR-STAGE',
            'smoke-core-tenants.mjs',
            'ensure-semeali-tenant.mjs --apply',
            'smoke-service-hub-stage.mjs',
            'npm run smoke:opr-pop',
            'npm run smoke:opr-platform',
            'apply-opr-meeting-actions.mjs'
          ];
          const forbiddenProd=[
            'repair-core-tenants-portable.mjs --env=production',
            'REPAIR-PRODUCTION',
            'smoke-core-tenants.mjs --base=https://allamo-pmo.pages.dev'
          ];
          for(const x of forbiddenStage) if(stage.includes(x)) throw new Error(`Provisionamento/mutação fixa proibida na Release STAGE: ${x}`);
          for(const x of forbiddenProd) if(prod.includes(x)) throw new Error(`Provisionamento fixo proibido na Release PROD: ${x}`);
          if(!stage.includes('--allow-zero=true')) throw new Error('Release STAGE deve validar governança com estado zero explícito.');
          if(!prod.includes('--allow-zero=true')) throw new Error('Release PROD deve validar governança com estado zero explícito.');
          if(health.includes('const requiredTenants')) throw new Error('Operational Health não pode exigir tenants fixos.');
          if(!health.includes('ALLAMO_EXPECTED_PUBLIC_TENANTS')) throw new Error('Validação de tenant do health deve ser opt-in por configuração explícita.');

          if(/\n\s*push:\s*\n/.test(madriSeed)) throw new Error('Seed MADRI não pode disparar automaticamente por push.');
          if(!/workflow_dispatch:\s*(?:\n|$)/.test(madriSeed)) throw new Error('Seed MADRI deve ser operação manual explícita.');
          if(!madriSeed.includes('Backup obrigatório do D1 Stage antes do seed MADRI')) throw new Error('Operação manual MADRI deve manter backup obrigatório antes do seed.');

          if(!madriCrud.includes("if: ${{ github.event_name == 'workflow_dispatch' }}")) throw new Error('CRUD remoto MADRI deve estar restrito a workflow_dispatch.');
          if(!madriCrud.includes('Validar build e contrato MADRI sem tocar no Stage')) throw new Error('PR MADRI deve possuir validação estática sem escrita remota.');
          if(!madriCrud.includes('Backup obrigatório antes do CRUD remoto manual')) throw new Error('CRUD remoto manual MADRI deve ter backup obrigatório.');

          console.log('[OK] STAGE/PROD preservam baseline zero; seed e CRUD remoto MADRI exigem operação manual explícita.');
          NODE
      - name: Teste consolidado de governança
        run: npm run test:governance
