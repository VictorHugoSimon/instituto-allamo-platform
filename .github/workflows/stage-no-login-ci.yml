name: Stage No Login CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  stage-no-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build final portal artifact
        run: npm run build:work
      - name: Validate Stage no-login isolation
        run: npm run test:stage-no-login
      - name: Validate environment isolation
        run: npm run test:env-isolation
      - name: Validate tenant isolation
        run: npm run test:tenant
