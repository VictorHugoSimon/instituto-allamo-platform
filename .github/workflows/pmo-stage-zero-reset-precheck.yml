name: PMO STAGE Zero Reset Precheck

on:
  push:
    branches: [ops/pmo-stage-reset-zero]
    paths: [.github/workflows/pmo-stage-zero-reset-precheck.yml]

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar que o lote recusado não alterou o D1 STAGE
        run: |
          npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.stage.toml --command "SELECT (SELECT COUNT(*) FROM companies) AS companies, (SELECT COUNT(*) FROM projects) AS projects;" --json | tee /tmp/precheck.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/precheck.json','utf8');
          const a=raw.indexOf('['), b=raw.lastIndexOf(']');
          if(a<0||b<a) throw new Error('Resposta D1 sem JSON reconhecível');
          const p=JSON.parse(raw.slice(a,b+1));
          const row=p.flatMap(x=>x?.results||[])[0]||{};
          console.log(`companies=${row.companies}; projects=${row.projects}`);
          if(Number(row.companies)!==4||Number(row.projects)!==3) throw new Error('Estado D1 divergiu de 4 empresas/3 projetos; nova tentativa bloqueada.');
          console.log('[OK] Lote anterior não alterou o estado do D1 STAGE.');
          NODE
