name: ONE TIME - Cloudflare Secret Shape

on:
  push:
    branches:
      - ops/diagnose-cloudflare-secret-shape

permissions:
  contents: read
  statuses: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Classify configured Cloudflare credentials without exposing values
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          CONTEXT="allamo/cf-secret-unclassified"
          if [ -z "$TOKEN" ] && [ -z "$KEY" ]; then
            CONTEXT="allamo/cf-secret-none"
          elif [ -n "$TOKEN" ] && [ "$TOKEN" = "$ACCOUNT" ] && [ -n "$KEY" ] && [ -n "$EMAIL" ]; then
            CONTEXT="allamo/cf-token-accountid-fallback-key-email-present"
          elif [ -n "$TOKEN" ] && [ "$TOKEN" = "$ACCOUNT" ]; then
            CONTEXT="allamo/cf-token-accountid-no-fallback"
          elif [[ "$TOKEN" =~ ^[A-Fa-f0-9]{32}$ ]] && [ -z "$EMAIL" ]; then
            CONTEXT="allamo/cf-token-hex32-missing-email"
          elif [[ "$TOKEN" =~ ^[A-Fa-f0-9]{32}$ ]] && [ -n "$EMAIL" ]; then
            CONTEXT="allamo/cf-token-hex32-with-email"
          elif [ -n "$TOKEN" ] && [ ${#TOKEN} -ge 20 ]; then
            CONTEXT="allamo/cf-modern-token-present"
          elif [ -n "$KEY" ] && [ -n "$EMAIL" ]; then
            CONTEXT="allamo/cf-global-key-with-email"
          elif [ -n "$KEY" ] && [ -z "$EMAIL" ]; then
            CONTEXT="allamo/cf-global-key-missing-email"
          else
            CONTEXT="allamo/cf-secret-malformed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context="$CONTEXT" -f description='Classificação sem exposição de segredo'
