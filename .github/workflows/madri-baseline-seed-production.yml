name: MADRI - Seed Baseline D1 PRODUCTION - Manual Only

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/madri/madri-governance-*-baseline.json.gz.b64'
      - 'scripts/seed-madri-governance-baseline-production.mjs'
      - 'scripts/validate-madri-baseline-seed-production.mjs'
      - '.github/workflows/madri-baseline-seed-production.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite SEED-MADRI-BASELINE-PRODUCTION para liberar a carga produtiva'
        required: true
        type: string
      reason:
        description: 'Motivo/autorização da carga produtiva MADRI'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: madri-baseline-seed-production
  cancel-in-progress: false

jobs:
  validate-production-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Validar contrato fail-closed do seed produtivo
        run: |
          node --check scripts/seed-madri-governance-baseline-production.mjs
          node scripts/validate-madri-baseline-seed-production.mjs

  seed-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'SEED-MADRI-BASELINE-PRODUCTION' }}
    needs: validate-production-seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci

      - name: Preparar autenticação Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node sallamos-ai/scripts/prepare-cloudflare-auth.mjs

      - name: Preflight Cloudflare Produção
        run: npx wrangler@4.124.0 whoami

      - name: Validar schema MADRI sem escrever
        run: node scripts/ensure-madri-governance-schema.mjs --env=production

      - name: Dry-run do baseline e resolução de contexto MADRI
        run: node scripts/seed-madri-governance-baseline-production.mjs

      - name: Backup obrigatório do D1 Produção antes do baseline
        run: node scripts/secure-d1-export.mjs --config wrangler.production.toml --output "backup-production-madri-baseline-${GITHUB_SHA}.sql"

      - name: Guardar backup produtivo
        uses: actions/upload-artifact@v4
        with:
          name: d1-production-madri-baseline-backup-${{ github.sha }}
          path: backup-production-madri-baseline-${{ github.sha }}.sql
          if-no-files-found: error
          retention-days: 30

      - name: Aplicar baseline MADRI em Produção
        run: node scripts/seed-madri-governance-baseline-production.mjs --apply --confirm=SEED-MADRI-BASELINE-PRODUCTION

      - name: Verificação idempotente pós-seed
        run: node scripts/seed-madri-governance-baseline-production.mjs

      - name: Validar contagens produtivas isoladas
        run: |
          npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.production.toml --command "SELECT c.id company_id,c.name company_name,p.id project_id,p.name project_name,(SELECT COUNT(*) FROM madri_requirements r WHERE r.company_id=c.id AND r.project_id=p.id AND r.archived_at IS NULL) requirements,(SELECT COUNT(*) FROM madri_tests t WHERE t.company_id=c.id AND t.project_id=p.id AND t.archived_at IS NULL) tests,(SELECT COUNT(*) FROM madri_implementation_phases f WHERE f.company_id=c.id AND f.project_id=p.id AND f.archived_at IS NULL) phases,(SELECT COUNT(*) FROM madri_readiness rd WHERE rd.company_id=c.id AND rd.project_id=p.id AND rd.archived_at IS NULL) readiness FROM companies c JOIN projects p ON p.company_id=c.id WHERE lower(replace(c.name,' ','')) IN ('madri','madrid') AND lower(p.name) LIKE '%nucci%';" --json > /tmp/madri-production-baseline.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/madri-production-baseline.json','utf8');
          const a=raw.indexOf('['),b=raw.lastIndexOf(']');
          if(a<0||b<a)throw new Error('Resposta D1 sem JSON reconhecível');
          const rows=JSON.parse(raw.slice(a,b+1)).flatMap(x=>x?.results||[]);
          if(rows.length!==1)throw new Error(`Contexto MADRI/NUCCI produtivo não é único: ${rows.length}`);
          const r=rows[0];
          if(Number(r.requirements)<86||Number(r.tests)<54||Number(r.phases)<15||Number(r.readiness)<17)throw new Error(`Baseline produtivo incompleto: req=${r.requirements}, tests=${r.tests}, phases=${r.phases}, readiness=${r.readiness}`);
          console.log(`[OK] MADRI Produção: ${r.company_name} / ${r.project_name}; req=${r.requirements}, tests=${r.tests}, phases=${r.phases}, readiness=${r.readiness}`);
          NODE

      - name: Resumo da operação
        if: always()
        run: |
          echo '### MADRI — Baseline D1 PRODUÇÃO' >> "$GITHUB_STEP_SUMMARY"
          echo '- Execução: exclusivamente manual por workflow_dispatch' >> "$GITHUB_STEP_SUMMARY"
          echo '- Confirmação exigida: SEED-MADRI-BASELINE-PRODUCTION' >> "$GITHUB_STEP_SUMMARY"
          echo '- Motivo/autorização: ${{ inputs.reason }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Contexto: tenant MADRI existente + projeto NUCCI existente; o workflow não cria nenhum dos dois' >> "$GITHUB_STEP_SUMMARY"
          echo '- Baseline esperado: 86 requisitos / 54 testes / 15 fases / 17 readiness' >> "$GITHUB_STEP_SUMMARY"
          echo '- Escrita: INSERT OR IGNORE; sem delete/update de registros de negócio' >> "$GITHUB_STEP_SUMMARY"
          echo '- Backup D1 Produção: obrigatório antes da aplicação e retido por 30 dias' >> "$GITHUB_STEP_SUMMARY"
          echo '- OPR/Semeali/outros tenants: fora do escopo' >> "$GITHUB_STEP_SUMMARY"
