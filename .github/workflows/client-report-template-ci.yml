name: Client Executive Report Template CI

# Protege o template oficial do Status Report exibido no link do cliente.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  client-report-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build final portal artifact
        run: npm run build:work
      - name: Validate official client report template
        run: node scripts/validate-client-executive-template.mjs
      - name: Validate public tenant isolation
        run: npm run test:tenant
      - name: Validate report series
        run: npm run test:series
      - name: Validate report AI governance
        run: npm run test:report-ai
