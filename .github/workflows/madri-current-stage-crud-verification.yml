name: MADRI PMO - Current Stage CRUD Verification

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/madri-current-stage-crud-verification.yml'
      - '.github/workflows/madri-pmo-stage-schema.yml'
      - 'scripts/smoke-madri-pmo-stage.mjs'
      - 'scripts/prepare-stage-smoke-session.mjs'
      - 'scripts/expire-stage-smoke-session.mjs'
      - 'src/madri-pmo-api.js'
      - 'scripts/build-madri-pmo.mjs'
      - 'scripts/validate-madri-pmo-static.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madri-current-stage-crud-verification-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar build e contrato MADRI sem tocar no Stage
        run: |
          npm run build:work
          npm run test:madri-pmo
      - name: Resumo da validação de PR
        if: always()
        run: |
          echo "### MADRI PMO · Static Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evento: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: somente build/contrato local; nenhuma escrita remota" >> "$GITHUB_STEP_SUMMARY"

  verify-current-stage:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar autenticação Cloudflare somente para o D1 de Stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node sallamos-ai/scripts/prepare-cloudflare-auth.mjs
      - name: Backup obrigatório antes do CRUD remoto manual
        run: node scripts/secure-d1-export.mjs --config wrangler.stage.toml --output "backup-stage-before-madri-crud-${GITHUB_SHA}.sql"
      - name: Guardar backup da verificação manual
        uses: actions/upload-artifact@v4
        with:
          name: d1-stage-before-madri-crud-${{ github.sha }}
          path: backup-stage-before-madri-crud-${{ github.sha }}.sql
          if-no-files-found: error
          retention-days: 14
      - name: Criar sessão técnica efêmera autenticada no Stage
        run: node scripts/prepare-stage-smoke-session.mjs
      - name: Smoke CRUD completo no Stage já publicado
        env:
          ALLAMO_STAGE_URL: https://allamo-pmo-stage.pages.dev
        run: node scripts/smoke-madri-pmo-stage.mjs
      - name: Expirar sessão técnica do smoke
        if: always()
        run: node scripts/expire-stage-smoke-session.mjs
      - name: Resumo
        if: always()
        run: |
          echo "### MADRI PMO · Current Stage CRUD Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Disparo remoto: exclusivamente manual" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ambiente testado: https://allamo-pmo-stage.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backup D1: obrigatório antes do CRUD remoto" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sem deploy e sem acesso ao D1 oficial de Produção" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sessão: técnica, efêmera, mascarada e exclusiva do Stage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Segurança: DELETE anônimo permanece bloqueado" >> "$GITHUB_STEP_SUMMARY"
