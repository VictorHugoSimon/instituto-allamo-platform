name: PMO Onboarding STAGE Negative Smoke

on:
  push:
    branches:
      - validation/pmo-onboarding-stage-negative
    paths:
      - 'scripts/smoke-pmo-onboarding-stage-negative.mjs'
      - '.github/workflows/pmo-onboarding-stage-negative-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding-stage-negative-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLAMO_STAGE_URL: https://allamo-pmo-stage.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Confirmar baseline zero antes do smoke
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.124.0 d1 execute allamo-pmo-stage --remote --config wrangler.stage.toml --command "SELECT (SELECT COUNT(*) FROM companies) AS companies, (SELECT COUNT(*) FROM projects) AS projects;" --json > /tmp/before.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/before.json','utf8'));const r=x?.[0]?.results?.[0];if(Number(r?.companies)!==0||Number(r?.projects)!==0)throw new Error('Baseline STAGE não está em 0 empresas / 0 projetos: '+JSON.stringify(r));console.log('OK baseline antes: 0 empresas / 0 projetos.');"

      - name: Smoke negativo autenticado do onboarding
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(node -e "console.log(require('node:crypto').randomUUID())")"
          echo "::add-mask::$TOKEN"
          cleanup() {
            npx wrangler@4.124.0 d1 execute allamo-pmo-stage --remote --config wrangler.stage.toml --command "DELETE FROM sessions WHERE token='$TOKEN';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx wrangler@4.124.0 d1 execute allamo-pmo-stage --remote --config wrangler.stage.toml --command "INSERT INTO sessions (token,user_id,expires_at) SELECT '$TOKEN',id,datetime('now','+10 minutes') FROM users WHERE role IN ('admin','pmo') AND (status IS NULL OR status <> 'Bloqueado') ORDER BY CASE role WHEN 'admin' THEN 0 ELSE 1 END,id LIMIT 1;" >/dev/null
          ALLAMO_PMO_SMOKE_TOKEN="$TOKEN" node scripts/smoke-pmo-onboarding-stage-negative.mjs

      - name: Confirmar ausência de escrita de negócio após o smoke
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.124.0 d1 execute allamo-pmo-stage --remote --config wrangler.stage.toml --command "SELECT (SELECT COUNT(*) FROM companies) AS companies, (SELECT COUNT(*) FROM projects) AS projects;" --json > /tmp/after.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'));const r=x?.[0]?.results?.[0];if(Number(r?.companies)!==0||Number(r?.projects)!==0)throw new Error('Smoke alterou dados de negócio: '+JSON.stringify(r));console.log('OK baseline depois: 0 empresas / 0 projetos. Nenhum tenant/projeto fictício criado.');"
