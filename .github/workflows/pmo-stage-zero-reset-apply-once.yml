name: PMO STAGE Zero Reset Apply Once

on:
  push:
    branches:
      - ops/pmo-stage-reset-zero
    paths:
      - .github/workflows/pmo-stage-zero-reset-apply-once.yml

permissions:
  contents: read

jobs:
  reset-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://allamo-pmo-stage.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar estado pré-reset 4 empresas / 3 projetos
        run: |
          npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.stage.toml --command "SELECT (SELECT COUNT(*) FROM companies) AS companies, (SELECT COUNT(*) FROM projects) AS projects;" --json | tee /tmp/pre-reset.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/pre-reset.json','utf8');
          const a=raw.indexOf('['), b=raw.lastIndexOf(']');
          if(a<0||b<a) throw new Error('Resposta D1 sem JSON reconhecível');
          const row=JSON.parse(raw.slice(a,b+1)).flatMap(x=>x?.results||[])[0]||{};
          if(Number(row.companies)!==4||Number(row.projects)!==3) throw new Error(`Pré-condição divergente: companies=${row.companies}, projects=${row.projects}`);
          console.log('[OK] Pré-condição 4/3 confirmada.');
          NODE

      - name: Gate de fronteira — módulos fora do PMO
        run: node scripts/check-pmo-reset-protected-boundary.mjs

      - name: Executar reset PMO V2 controlado somente no D1 STAGE
        run: node scripts/reset-stage-pmo-data-v2.mjs --apply --confirm=RESET-PMO-STAGE

      - name: Validar estado zero diretamente no D1 STAGE
        run: |
          npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.stage.toml --command "SELECT (SELECT COUNT(*) FROM companies) AS companies, (SELECT COUNT(*) FROM projects) AS projects;" --json | tee /tmp/pmo-zero.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/pmo-zero.json','utf8');
          const a=raw.indexOf('['), b=raw.lastIndexOf(']');
          if(a<0||b<a) throw new Error('Resposta D1 sem JSON reconhecível');
          const payload=JSON.parse(raw.slice(a,b+1));
          const row=payload.flatMap(x=>x?.results||[])[0]||{};
          if(Number(row.companies)!==0||Number(row.projects)!==0) throw new Error(`Estado zero não confirmado: companies=${row.companies}, projects=${row.projects}`);
          console.log('[OK] D1 STAGE confirmado com 0 empresas e 0 projetos.');
          NODE

      - name: Criar sessão efêmera PMO para smoke autenticado
        run: node scripts/prepare-stage-smoke-session.mjs

      - name: Smoke runtime do Cockpit após reset
        run: |
          node --input-type=module - <<'NODE'
          const base=process.env.BASE_URL;
          const token=process.env.ALLAMO_SMOKE_TOKEN;
          if(!token) throw new Error('Sessão técnica de smoke não foi criada.');
          const headers={authorization:`Bearer ${token}`};

          const main=await fetch(base+'/',{redirect:'follow'});
          const html=await main.text();
          if(!main.ok) throw new Error(`Portal STAGE respondeu ${main.status}`);
          if(!html.includes('/pmo-cockpit/')||!html.includes('Cockpit Executivo')) throw new Error('Navegação do Cockpit não está materializada no portal STAGE.');

          const page=await fetch(base+'/pmo-cockpit/',{redirect:'follow'});
          const pageHtml=await page.text();
          if(!page.ok||!pageHtml.includes('Cockpit Executivo')) throw new Error(`Página do Cockpit inválida (${page.status}).`);

          const api=await fetch(base+'/api/pmo-cockpit',{headers});
          const data=await api.json();
          if(!api.ok) throw new Error(`API Cockpit respondeu ${api.status}: ${JSON.stringify(data)}`);
          const companies=Number(data?.portfolio?.companies);
          const projects=Number(data?.portfolio?.projects);
          if(companies!==0||projects!==0) throw new Error(`Cockpit não refletiu estado zero: companies=${companies}, projects=${projects}`);

          const curve=await fetch(base+'/api/dash-curve',{headers});
          if(!curve.ok) throw new Error(`Curva S respondeu ${curve.status}`);
          await curve.json();
          console.log('[OK] Runtime STAGE: navegação, Cockpit, API 0/0 e Curva S válidos.');
          NODE

      - name: Expirar sessão técnica do smoke
        if: always()
        run: |
          if [ -n "${ALLAMO_SMOKE_TOKEN:-}" ]; then
            SAFE_TOKEN=$(printf '%s' "$ALLAMO_SMOKE_TOKEN" | sed "s/'/''/g")
            npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.stage.toml --command "DELETE FROM sessions WHERE token='${SAFE_TOKEN}';" >/dev/null
          fi

      - name: Preservar backup do reset como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmo-stage-zero-reset-backup-${{ github.run_id }}
          path: backups/stage-before-pmo-zero-reset-*.sql
          if-no-files-found: error
          retention-days: 30
