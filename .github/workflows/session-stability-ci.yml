name: Session Stability CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  session-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build final portal artifact
        run: npm run build:work
      - name: Validate session stability
        run: npm run test:session
      - name: Validate data freshness
        run: npm run test:freshness
      - name: Validate tenant isolation
        run: npm run test:tenant
