name: PMO STAGE Zero Runtime Validation

on:
  push:
    branches:
      - ops/pmo-stage-reset-zero
    paths:
      - '.github/workflows/pmo-stage-zero-runtime-validate.yml'

permissions:
  contents: read

jobs:
  runtime-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://allamo-pmo-stage.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate D1 STAGE 0/0
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            if npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.stage.toml --command "SELECT (SELECT COUNT(*) FROM companies) AS companies, (SELECT COUNT(*) FROM projects) AS projects;" --json > /tmp/zero.json 2>/tmp/zero.err; then
              if node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/zero.json','utf8');
          const a=raw.indexOf('['), b=raw.lastIndexOf(']');
          if(a<0||b<a) process.exit(2);
          const row=JSON.parse(raw.slice(a,b+1)).flatMap(x=>x?.results||[])[0]||{};
          console.log(`D1: companies=${row.companies}, projects=${row.projects}`);
          if(Number(row.companies)!==0||Number(row.projects)!==0) process.exit(3);
          NODE
              then ok=1; break; fi
            else
              cat /tmp/zero.err || true
            fi
            sleep $((attempt*3))
          done
          test "$ok" -eq 1
          echo '[OK] D1 STAGE 0/0.'

      - name: Criar sessão efêmera PMO
        run: node scripts/prepare-stage-smoke-session.mjs

      - name: Smoke runtime do Cockpit em estado zero
        run: |
          node --input-type=module - <<'NODE'
          const base=process.env.BASE_URL;
          const token=process.env.ALLAMO_SMOKE_TOKEN;
          if(!token) throw new Error('ALLAMO_SMOKE_TOKEN ausente');
          const headers={authorization:`Bearer ${token}`};

          const main=await fetch(base+'/',{redirect:'follow'});
          const html=await main.text();
          if(!main.ok) throw new Error(`Portal ${main.status}`);
          const navCount=(html.match(/\/pmo-cockpit\//g)||[]).length;
          if(navCount<1||!html.includes('Cockpit Executivo')) throw new Error('Navegação do Cockpit ausente');

          const page=await fetch(base+'/pmo-cockpit/',{redirect:'follow'});
          const pageHtml=await page.text();
          if(!page.ok||!pageHtml.includes('Cockpit Executivo')) throw new Error(`Cockpit page ${page.status}`);

          const api=await fetch(base+'/api/pmo-cockpit',{headers});
          const data=await api.json();
          if(!api.ok) throw new Error(`Cockpit API ${api.status}: ${JSON.stringify(data)}`);
          const companies=Number(data?.portfolio?.companies);
          const projects=Number(data?.portfolio?.projects);
          const active=Number(data?.portfolio?.active);
          const inProgress=Number(data?.portfolio?.in_progress);
          const backlog=Number(data?.portfolio?.backlog);
          const completed=Number(data?.portfolio?.completed);
          console.log({companies,projects,active,inProgress,backlog,completed,health:data?.health});
          if(companies!==0||projects!==0) throw new Error(`Cockpit runtime não está 0/0: ${companies}/${projects}`);

          const curve=await fetch(base+'/api/dash-curve',{headers});
          const curveData=await curve.json();
          if(!curve.ok) throw new Error(`Curva S ${curve.status}`);
          if(!Array.isArray(curveData?.months)) throw new Error('Curva S sem months[]');

          console.log(`[OK] Runtime PMO STAGE: portal + Cockpit 0/0 + Curva S (${curveData.months.length} períodos).`);
          NODE

      - name: Expirar sessão técnica
        if: always()
        run: |
          if [ -n "${ALLAMO_SMOKE_TOKEN:-}" ]; then
            SAFE_TOKEN=$(printf '%s' "$ALLAMO_SMOKE_TOKEN" | sed "s/'/''/g")
            npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.stage.toml --command "DELETE FROM sessions WHERE token='${SAFE_TOKEN}';" >/dev/null || true
          fi
