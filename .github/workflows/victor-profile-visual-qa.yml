name: Victor Profile Visual QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: victor-profile-visual-qa
  cancel-in-progress: true

jobs:
  visual-qa:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'ops/victor-profile-cloudflare-bridge-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch operacional
        uses: actions/checkout@v4
        with:
          ref: ops/victor-profile-cloudflare-bridge-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Baixar Home STAGING
        run: |
          set -euo pipefail
          URL='https://victor-simon-site-staging.pages.dev/'
          ok=0
          for i in {1..8}; do
            if curl -fsSL "$URL" -o /tmp/home.html; then ok=1; break; fi
            sleep $((i * 2))
          done
          test "$ok" = '1'
          test -s /tmp/home.html
          echo "HOME_BYTES=$(wc -c < /tmp/home.html)" >> "$GITHUB_ENV"

      - name: Validar hero V2 publicado
        run: grep -Fq 'Clareza para decidir. Método para executar. Resultado para crescer.' /tmp/home.html

      - name: Validar seções V2 publicadas
        run: |
          set -euo pipefail
          for marker in 'id="consultoria"' 'id="servicos"' 'id="metodo"' 'id="projetos"' 'id="ifarm"'; do
            grep -Fq "$marker" /tmp/home.html
          done

      - name: Validar CSS V2 publicado
        run: grep -Fq '/assets/profile-v2.css' /tmp/home.html

      - name: Bloquear placeholder visual antigo
        run: |
          if grep -Fq 'class="initials">VS</span>' /tmp/home.html; then
            echo 'Placeholder visual antigo VS encontrado em STAGING.' >&2
            exit 1
          fi

      - name: Aguardar e validar Blog publicado
        run: |
          set -euo pipefail
          URL='https://victor-simon-site-staging.pages.dev/blog'
          ok=0
          for i in {1..15}; do
            if curl -fsSL "$URL" -o /tmp/blog.html && grep -Fq 'articleView' /tmp/blog.html; then
              ok=1
              break
            fi
            echo "Blog ainda não propagado na tentativa $i/15."
            sleep 4
          done
          test "$ok" = '1'
          grep -Fq 'postsGrid' /tmp/blog.html
          echo "BLOG_BYTES=$(wc -c < /tmp/blog.html)" >> "$GITHUB_ENV"

      - name: Validar painel Growth OS publicado
        run: |
          curl -fsSL 'https://victor-simon-site-staging.pages.dev/painel.html' -o /tmp/painel.html
          grep -Fq 'Growth OS' /tmp/painel.html

      - name: Instalar Chromium para QA visual
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capturar screenshots
        run: |
          set -euo pipefail
          mkdir -p qa/screenshots
          URL='https://victor-simon-site-staging.pages.dev'
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size='1440,1000' "$URL/" qa/screenshots/home-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --device='iPhone 13' "$URL/" qa/screenshots/home-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size='1440,1000' "$URL/blog" qa/screenshots/blog-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size='1440,1000' "$URL/painel.html" qa/screenshots/painel-login.png
          ls -lh qa/screenshots

      - name: Registrar evidências visuais na branch isolada
        run: |
          set -euo pipefail
          git config user.name 'Victor Profile QA Bot'
          git config user.email '111150704+VictorHugoSimon@users.noreply.github.com'
          git add qa/screenshots
          if git diff --cached --quiet; then
            echo 'Screenshots sem alteração.'
            exit 0
          fi
          git commit -m '[skip ci] qa: capture Victor profile STAGING visuals'
          git push origin HEAD:ops/victor-profile-cloudflare-bridge-v2

      - name: Resumo
        run: |
          echo '### Visual QA concluída' >> "$GITHUB_STEP_SUMMARY"
          echo "- Home bytes: ${HOME_BYTES:-n/a}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Blog bytes: ${BLOG_BYTES:-n/a}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Home desktop: qa/screenshots/home-desktop.png' >> "$GITHUB_STEP_SUMMARY"
          echo '- Home mobile: qa/screenshots/home-mobile.png' >> "$GITHUB_STEP_SUMMARY"
          echo '- Blog: qa/screenshots/blog-desktop.png' >> "$GITHUB_STEP_SUMMARY"
          echo '- Painel/login: qa/screenshots/painel-login.png' >> "$GITHUB_STEP_SUMMARY"
