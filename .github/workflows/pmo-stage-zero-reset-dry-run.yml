name: PMO STAGE Zero Reset Dry Run

on:
  push:
    branches:
      - ops/pmo-stage-reset-zero
    paths:
      - 'scripts/reset-stage-pmo-data.mjs'
      - '.github/workflows/pmo-stage-zero-reset-dry-run.yml'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar acesso ao D1 STAGE exato
        run: npx wrangler@4.124.0 d1 execute allamo-pmo-stage --remote --config wrangler.stage.toml --command "SELECT 1 AS ok;"
      - name: Executar somente dry-run do reset PMO
        run: node scripts/reset-stage-pmo-data.mjs
