name: PMO STAGE Zero Post-Reset Validation

on:
  push:
    branches:
      - ops/pmo-stage-reset-zero
    paths:
      - '.github/workflows/pmo-stage-zero-postreset-validate.yml'

permissions:
  contents: read

jobs:
  validate-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_URL: https://allamo-pmo-stage.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar D1 STAGE 0 empresas / 0 projetos com retry
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "Tentativa ${attempt}/5 de leitura do D1 STAGE..."
            if npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.stage.toml --command "SELECT (SELECT COUNT(*) FROM companies) AS companies, (SELECT COUNT(*) FROM projects) AS projects;" --json > /tmp/pmo-zero.json 2>/tmp/pmo-zero.err; then
              if node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/pmo-zero.json','utf8');
          const a=raw.indexOf('['), b=raw.lastIndexOf(']');
          if(a<0||b<a) process.exit(2);
          const row=JSON.parse(raw.slice(a,b+1)).flatMap(x=>x?.results||[])[0]||{};
          console.log(`D1 atual: companies=${row.companies}, projects=${row.projects}`);
          if(Number(row.companies)!==0||Number(row.projects)!==0) process.exit(3);
          NODE
              then
                ok=1
                break
              fi
            else
              cat /tmp/pmo-zero.err || true
            fi
            sleep $((attempt * 3))
          done
          if [ "$ok" -ne 1 ]; then
            echo "[ERRO] Não foi possível confirmar estado zero após 5 tentativas."
            exit 1
          fi
          echo "[OK] D1 STAGE confirmado com 0 empresas e 0 projetos."

      - name: Confirmar ausência de referências diretas aos tenants removidos nos módulos protegidos
        run: |
          npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.stage.toml --command "SELECT (SELECT COUNT(*) FROM access_invitations WHERE company_id IN ('dualclima','madri','opr','semeali')) AS access_invitations, (SELECT COUNT(*) FROM commercial_accounts WHERE company_id IN ('dualclima','madri','opr','semeali')) AS commercial_accounts, (SELECT COUNT(*) FROM commercial_approvals WHERE company_id IN ('dualclima','madri','opr','semeali')) AS commercial_approvals, (SELECT COUNT(*) FROM commercial_campaigns WHERE company_id IN ('dualclima','madri','opr','semeali')) AS commercial_campaigns, (SELECT COUNT(*) FROM commercial_interactions WHERE company_id IN ('dualclima','madri','opr','semeali')) AS commercial_interactions, (SELECT COUNT(*) FROM commercial_opportunities WHERE company_id IN ('dualclima','madri','opr','semeali')) AS commercial_opportunities, (SELECT COUNT(*) FROM commercial_route_stops WHERE company_id IN ('dualclima','madri','opr','semeali')) AS commercial_route_stops, (SELECT COUNT(*) FROM commercial_routes WHERE company_id IN ('dualclima','madri','opr','semeali')) AS commercial_routes, (SELECT COUNT(*) FROM service_hub_channels WHERE company_id IN ('dualclima','madri','opr','semeali')) AS service_hub_channels, (SELECT COUNT(*) FROM service_hub_messages WHERE company_id IN ('dualclima','madri','opr','semeali')) AS service_hub_messages, (SELECT COUNT(*) FROM service_hub_provider_events WHERE company_id IN ('dualclima','madri','opr','semeali')) AS service_hub_provider_events, (SELECT COUNT(*) FROM service_hub_sla_policies WHERE company_id IN ('dualclima','madri','opr','semeali')) AS service_hub_sla_policies, (SELECT COUNT(*) FROM service_hub_systems WHERE company_id IN ('dualclima','madri','opr','semeali')) AS service_hub_systems, (SELECT COUNT(*) FROM service_hub_tickets WHERE company_id IN ('dualclima','madri','opr','semeali')) AS service_hub_tickets;" --json > /tmp/protected-zero.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/protected-zero.json','utf8');
          const a=raw.indexOf('['), b=raw.lastIndexOf(']');
          if(a<0||b<a) throw new Error('Resposta protegida sem JSON reconhecível');
          const row=JSON.parse(raw.slice(a,b+1)).flatMap(x=>x?.results||[])[0]||{};
          const nonzero=Object.entries(row).filter(([,v])=>Number(v)!==0);
          console.log('Módulos protegidos:',row);
          if(nonzero.length) throw new Error('Referências protegidas remanescentes: '+JSON.stringify(nonzero));
          console.log('[OK] Módulos protegidos continuam sem vínculos aos tenants removidos.');
          NODE

      - name: Criar sessão efêmera PMO para smoke autenticado
        run: node scripts/prepare-stage-smoke-session.mjs

      - name: Validar portal, Cockpit 0/0 e Curva S no runtime STAGE
        run: |
          node --input-type=module - <<'NODE'
          const base=process.env.BASE_URL;
          const token=process.env.ALLAMO_SMOKE_TOKEN;
          if(!token) throw new Error('Sessão técnica de smoke não criada.');
          const headers={authorization:`Bearer ${token}`};

          const main=await fetch(base+'/',{redirect:'follow'});
          const html=await main.text();
          if(!main.ok) throw new Error(`Portal STAGE respondeu ${main.status}`);
          if(!html.includes('/pmo-cockpit/')||!html.includes('Cockpit Executivo')) throw new Error('Navegação do Cockpit não está materializada no portal.');

          const page=await fetch(base+'/pmo-cockpit/',{redirect:'follow'});
          const pageHtml=await page.text();
          if(!page.ok||!pageHtml.includes('Cockpit Executivo')) throw new Error(`Página Cockpit inválida (${page.status}).`);

          const api=await fetch(base+'/api/pmo-cockpit',{headers});
          const data=await api.json();
          if(!api.ok) throw new Error(`API Cockpit respondeu ${api.status}: ${JSON.stringify(data)}`);
          const companies=Number(data?.portfolio?.companies);
          const projects=Number(data?.portfolio?.projects);
          console.log(`Cockpit runtime: companies=${companies}, projects=${projects}`);
          if(companies!==0||projects!==0) throw new Error(`Cockpit não refletiu estado zero: companies=${companies}, projects=${projects}`);

          const curve=await fetch(base+'/api/dash-curve',{headers});
          const curveData=await curve.json();
          if(!curve.ok) throw new Error(`Curva S respondeu ${curve.status}`);
          if(!Array.isArray(curveData?.months)) throw new Error('Curva S sem contrato months[].');
          console.log(`[OK] Runtime STAGE validado: navegação + Cockpit 0/0 + Curva S (${curveData.months.length} períodos).`);
          NODE

      - name: Expirar sessão técnica do smoke
        if: always()
        run: |
          if [ -n "${ALLAMO_SMOKE_TOKEN:-}" ]; then
            SAFE_TOKEN=$(printf '%s' "$ALLAMO_SMOKE_TOKEN" | sed "s/'/''/g")
            npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.stage.toml --command "DELETE FROM sessions WHERE token='${SAFE_TOKEN}';" >/dev/null
          fi
