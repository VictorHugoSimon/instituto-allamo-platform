name: OPR Layout Reference Probe
on:
  push:
    branches: [feat/opr-layout-modelo-madri]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate OPR reference layout
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('public/opr-plano-de-acao/index.html','utf8');
          for(const expected of ['--char:#302f39','--copper:#b88b78','Plano Mestre','Customizações / Desenvolvimentos','Responsáveis por Papel','Pendências','Entrada de Demandas','Cadência Completa','Instituto Államo · PMO','OPR_Plano_Acao_PMO.json','opr-pendencies']){
            if(!html.includes(expected)) throw new Error('Conteúdo esperado ausente: '+expected);
          }
          if(/MADRI|Dual Clima|Madrid/i.test(html)) throw new Error('Contaminação de outro projeto detectada.');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1) throw new Error('Esperado um script inline; encontrados '+scripts.length);
          new Function(scripts[0][1]);
          console.log('OK: layout OPR alinhado ao modelo, sem contaminação e com JS válido.');
          NODE
