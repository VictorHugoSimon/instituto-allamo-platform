name: Victor Profile STAGE Bridge

on:
  push:
    branches: [ops/victor-profile-cloudflare-bridge-v2]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: victor-profile-stage-bridge
  cancel-in-progress: false

jobs:
  deploy-profile-stage:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'ops/victor-profile-cloudflare-bridge-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_ENVIRONMENT: staging
      WORKER_NAME: victor-simon-api-staging
      D1_DATABASE_NAME: vhs-db-staging
      R2_BUCKET_NAME: victor-simon-media-staging
      PAGES_PROJECT_NAME: victor-simon-site-staging
      PAGES_PRODUCTION_BRANCH: staging
      CORS_ORIGIN: https://victor-simon-site-staging.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout host de autenticação
        uses: actions/checkout@v4
        with:
          ref: ops/victor-profile-cloudflare-bridge-v2
          path: bridge-host

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preparar autenticação Cloudflare já autorizada
        env:
          CLOUDFLARE_AUTH_VERIFY: '1'
        run: node bridge-host/sallamos-ai/scripts/prepare-cloudflare-auth.mjs

      - name: Preflight Cloudflare
        run: npx --yes wrangler@4.124.0 whoami

      - name: Checkout do Perfil Profissional
        uses: actions/checkout@v4
        with:
          repository: VictorHugoSimon/victor-simon-site
          ref: feature/growth-os-v2
          path: profile

      - name: Instalar dependências e validar código
        working-directory: profile
        run: |
          npm ci
          npm run ci

      - name: Preparar secrets internos de STAGING
        working-directory: profile
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const material = process.env.CLOUDFLARE_API_TOKEN || process.env.CLOUDFLARE_API_KEY;
          if (!material) throw new Error('Nenhuma credencial Cloudflare utilizável ficou disponível após o preflight.');
          const derive = (label) => crypto
            .createHmac('sha256', material)
            .update(`victor-simon-site:staging:${label}`)
            .digest('hex');
          const blockedAdminPassword = crypto.randomBytes(48).toString('base64url');
          const values = {
            AUTH_SECRET: derive('auth'),
            ROBOT_KEY: derive('robot'),
            ADMIN_PASSWORD_HASH: crypto.createHash('sha256').update(blockedAdminPassword).digest('hex')
          };
          for (const [key, value] of Object.entries(values)) {
            console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          console.log('Painel administrativo permanecerá bloqueado neste deploy técnico de STAGING.');
          NODE

      - name: Garantir D1, Pages e R2 opcional
        working-directory: profile
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const apiKey = process.env.CLOUDFLARE_API_KEY;
          const email = process.env.CLOUDFLARE_EMAIL;
          if (!accountId) throw new Error('CLOUDFLARE_ACCOUNT_ID não ficou disponível no host autorizado.');
          const authHeaders = token
            ? { Authorization: `Bearer ${token}` }
            : { 'X-Auth-Email': email, 'X-Auth-Key': apiKey };
          async function cf(path, init = {}, accepted = [200]) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}${path}`, {
              ...init,
              headers: { ...authHeaders, 'Content-Type': 'application/json', ...(init.headers || {}) }
            });
            const data = await response.json().catch(() => ({}));
            if (!accepted.includes(response.status) || data.success === false) {
              const details = (data.errors || []).map((e) => `${e.code}: ${e.message}`).join('; ');
              throw new Error(`Cloudflare ${response.status} ${path}${details ? ` — ${details}` : ''}`);
            }
            return { status: response.status, data };
          }
          const dbName = process.env.D1_DATABASE_NAME;
          const list = await cf(`/d1/database?name=${encodeURIComponent(dbName)}&per_page=100`);
          let db = list.data.result?.find((item) => item.name === dbName);
          if (!db) {
            db = (await cf('/d1/database', { method: 'POST', body: JSON.stringify({ name: dbName, primary_location_hint: 'enam' }) })).data.result;
            console.log(`D1 criado: ${dbName}`);
          } else console.log(`D1 existente: ${dbName}`);
          if (!db?.uuid) throw new Error('Cloudflare não retornou UUID do D1.');

          const pagesName = process.env.PAGES_PROJECT_NAME;
          const pagePath = `/pages/projects/${encodeURIComponent(pagesName)}`;
          const page = await cf(pagePath, { method: 'GET' }, [200, 404]);
          if (page.status === 404) {
            await cf('/pages/projects', { method: 'POST', body: JSON.stringify({ name: pagesName, production_branch: process.env.PAGES_PRODUCTION_BRANCH }) });
            console.log(`Pages criado: ${pagesName}`);
          } else console.log(`Pages existente: ${pagesName}`);

          let r2Ready = false;
          try {
            const bucketName = process.env.R2_BUCKET_NAME;
            const bucketPath = `/r2/buckets/${encodeURIComponent(bucketName)}`;
            const bucket = await cf(bucketPath, { method: 'GET' }, [200, 404]);
            if (bucket.status === 404) {
              await cf('/r2/buckets', { method: 'POST', body: JSON.stringify({ name: bucketName, locationHint: 'enam', storageClass: 'Standard' }) });
              console.log(`R2 criado: ${bucketName}`);
            } else console.log(`R2 existente: ${bucketName}`);
            r2Ready = true;
          } catch (error) {
            console.warn(`R2 opcional não provisionado: ${error.message}`);
          }

          const values = {
            D1_DATABASE_ID: db.uuid,
            R2_READY: r2Ready ? '1' : '0'
          };
          for (const [key, value] of Object.entries(values)) fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          NODE

      - name: Gerar configuração Wrangler
        working-directory: profile
        run: node scripts/generate-wrangler-config.mjs

      - name: Aplicar migrations D1
        working-directory: profile
        run: npx --yes wrangler@4.124.0 d1 migrations apply vhs-db-staging --remote --config wrangler.generated.jsonc

      - name: Publicar Worker
        working-directory: profile
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 deploy --config wrangler.generated.jsonc 2>&1 | tee /tmp/victor-worker.log
          API_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/victor-worker.log | tail -1 || true)"
          if [ -z "$API_URL" ]; then
            echo 'Não foi possível identificar a URL workers.dev após o deploy.' >&2
            exit 1
          fi
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "API publicada em $API_URL"

      - name: Gravar secrets internos no Worker
        working-directory: profile
        run: |
          set -euo pipefail
          printf '%s' "$AUTH_SECRET" | npx --yes wrangler@4.124.0 secret put AUTH_SECRET --config wrangler.generated.jsonc >/dev/null
          printf '%s' "$ROBOT_KEY" | npx --yes wrangler@4.124.0 secret put ROBOT_KEY --config wrangler.generated.jsonc >/dev/null
          printf '%s' "$ADMIN_PASSWORD_HASH" | npx --yes wrangler@4.124.0 secret put ADMIN_PASSWORD_HASH --config wrangler.generated.jsonc >/dev/null
          echo 'Secrets internos gravados sem exposição.'

      - name: Preparar site STAGING
        working-directory: profile
        env:
          SITE_BASE: https://victor-simon-site-staging.pages.dev
          REQUIRE_API_BASE: '1'
        run: |
          export API_BASE="$API_URL"
          npm run build:staging

      - name: Publicar Pages STAGING
        working-directory: profile
        run: npx --yes wrangler@4.124.0 pages deploy dist --project-name=victor-simon-site-staging --branch=staging --commit-dirty=true

      - name: Smoke test
        working-directory: profile
        env:
          SITE_URL: https://victor-simon-site-staging.pages.dev
        run: node scripts/smoke-deployment.mjs

      - name: Resumo
        if: always()
        run: |
          echo '### Victor Hugo Profile STAGING Bridge' >> "$GITHUB_STEP_SUMMARY"
          echo '- Fonte: VictorHugoSimon/victor-simon-site@feature/growth-os-v2' >> "$GITHUB_STEP_SUMMARY"
          echo '- Destino Pages: https://victor-simon-site-staging.pages.dev' >> "$GITHUB_STEP_SUMMARY"
          echo '- Worker: victor-simon-api-staging' >> "$GITHUB_STEP_SUMMARY"
          echo '- D1: vhs-db-staging' >> "$GITHUB_STEP_SUMMARY"
          echo '- Államo main/develop/produção: não alterados' >> "$GITHUB_STEP_SUMMARY"
