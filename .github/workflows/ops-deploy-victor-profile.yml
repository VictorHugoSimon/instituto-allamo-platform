name: OPS Deploy Victor Hugo Profile Pages

on:
  pull_request_target:
    types: [edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-profile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/victor-profile-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_PROJECT_NAME: victor-hugo-teixeira-simon
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout do site profissional
        uses: actions/checkout@v4
        with:
          repository: VictorHugoSimon/victor-simon-site
          ref: main
          path: profile

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: profile/package-lock.json

      - name: Instalar e validar
        working-directory: profile
        run: |
          npm ci
          npm run ci

      - name: Build público provisório
        working-directory: profile
        env:
          API_BASE: https://api.example.invalid
        run: npm run build:production

      - name: Validar Cloudflare
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@4.124.0 whoami

      - name: Criar ou confirmar projeto Pages
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const name = process.env.PAGES_PROJECT_NAME;
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          const current = await fetch(`${base}/pages/projects/${encodeURIComponent(name)}`, { headers });
          if (current.status === 404) {
            const created = await fetch(`${base}/pages/projects`, {
              method: 'POST', headers,
              body: JSON.stringify({ name, production_branch: 'main' })
            });
            const data = await created.json();
            if (!created.ok || data.success === false) throw new Error(JSON.stringify(data.errors || data));
            console.log(`Pages criado: ${name}`);
          } else {
            const data = await current.json();
            if (!current.ok || data.success === false) throw new Error(JSON.stringify(data.errors || data));
            console.log(`Pages existente: ${name}`);
          }
          NODE

      - name: Deploy Cloudflare Pages
        working-directory: profile
        run: npx wrangler@4.124.0 pages deploy dist --project-name="$PAGES_PROJECT_NAME" --branch=main --commit-dirty=true

      - name: Smoke público
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://victor-hugo-teixeira-simon.pages.dev/';
          let last = '';
          for (let i = 0; i < 10; i++) {
            try {
              const r = await fetch(url, { redirect: 'follow' });
              last = `${r.status}`;
              if (r.ok) {
                const html = await r.text();
                if (/Victor Hugo/i.test(html)) {
                  console.log(`OK: ${url}`);
                  process.exit(0);
                }
              }
            } catch (e) { last = e.message; }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          throw new Error(`Smoke falhou: ${last}`);
          NODE

      - name: Registrar resultado na PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body "✅ Perfil publicado: https://victor-hugo-teixeira-simon.pages.dev/"
