name: ONE TIME - Recover Core Tenants and Release

on:
  push:
    branches:
      - ops/recover-stage-prod-core-tenants-20260823

permissions:
  contents: read
  statuses: write

concurrency:
  group: allamo-core-tenant-recovery-20260823
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark validation pending
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=allamo/core-recovery-validate -f description='Build e testes completos em andamento'

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard identical main/develop application tree
        shell: bash
        run: |
          git fetch origin main develop
          MAIN_TREE="$(git rev-parse origin/main^{tree})"
          DEVELOP_TREE="$(git rev-parse origin/develop^{tree})"
          echo "main=$MAIN_TREE develop=$DEVELOP_TREE"
          test "$MAIN_TREE" = "$DEVELOP_TREE"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build:work
      - name: Full release gate
        run: npm run test:release

      - name: Upload exact validated public artifact
        uses: actions/upload-artifact@v4
        with:
          name: allamo-release-public-20260823
          path: public
          if-no-files-found: error
          retention-days: 7

      - name: Mark validation success
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=allamo/core-recovery-validate -f description='Build e test:release aprovados'

      - name: Mark validation failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=allamo/core-recovery-validate -f description='Falha em build/testes; Stage não será alterado'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=allamo/core-recovery -f description='Recuperação interrompida na validação'

  stage:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Mark Stage pending
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=allamo/core-recovery -f description='Validação aprovada; recuperando Stage'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=allamo/core-recovery-stage -f description='Backup, reparo, deploy e smoke do Stage'

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Download exact validated artifact
        uses: actions/download-artifact@v4
        with:
          name: allamo-release-public-20260823
          path: public

      - name: Prepare Cloudflare auth
        run: node sallamos-ai/scripts/prepare-cloudflare-auth.mjs

      - name: Cloudflare auth preflight
        run: npx wrangler@4.124.0 whoami

      - name: Portable Wrangler JSON parser for recovery
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/repair-core-tenants.mjs';
          let s=fs.readFileSync(p,'utf8');
          const old=`    let parsed;\n    try{ parsed=JSON.parse(out); }\n    catch{ throw new Error('Wrangler retornou saída não-JSON ao consultar D1.'); }`;
          const neu=`    let parsed;\n    try{ parsed=JSON.parse(out); }\n    catch{\n      const clean=String(out||'').replace(/\\u001b\\[[0-9;?]*[ -\\/]*[@-~]/g,'').trim(); let ok=null;\n      const starts=[]; for(let i=0;i<clean.length;i++) if(clean[i]==='['||clean[i]==='{') starts.push(i);\n      const ends=[]; for(let i=clean.length-1;i>=0;i--) if(clean[i]===']'||clean[i]==='}') ends.push(i);\n      outer: for(const a of starts){ for(const b of ends){ if(b<=a) continue; try{ ok=JSON.parse(clean.slice(a,b+1)); break outer; }catch{} } }\n      if(ok===null) throw new Error('Wrangler retornou saída sem payload JSON reconhecível ao consultar D1.'); parsed=ok;\n    }`;
          if(!s.includes(old)) throw new Error('Parser esperado não encontrado');
          fs.writeFileSync(p,s.replace(old,neu));
          NODE
          node scripts/validate-core-tenant-repair.mjs

      - name: Backup Stage before repair
        run: npx wrangler@4.124.0 d1 export DB --remote --config wrangler.stage.toml --output=backup-stage-before-core-recovery.sql

      - name: Stage dry-run
        run: node scripts/repair-core-tenants.mjs --env=stage

      - name: Stage additive apply
        run: node scripts/repair-core-tenants.mjs --env=stage --apply --confirm=REPAIR-STAGE

      - name: Stage post-repair dry-run
        run: node scripts/repair-core-tenants.mjs --env=stage

      - name: Deploy exact artifact to Stage
        shell: bash
        run: |
          cp wrangler.stage.toml wrangler.toml
          grep -F 'name = "allamo-pmo-stage"' wrangler.toml
          npx wrangler@4.124.0 pages deploy public --project-name allamo-pmo-stage --branch production --commit-dirty=true

      - name: Stage smoke test
        env: { BASE_URL: "https://allamo-pmo-stage.pages.dev" }
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL,sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){let last='';for(let i=0;i<12;i++){try{const r=await fetch(base+path,{headers:{'cache-control':'no-cache'},cache:'no-store'});const t=await r.text();if(r.ok){try{return JSON.parse(t)}catch{last='JSON inválido '+t.slice(0,160)}}else last='HTTP '+r.status+' '+t.slice(0,160)}catch(e){last=String(e)}await sleep(3000)}throw new Error(path+' falhou: '+last)}
          const companies=await get('/api/companies'); if(!Array.isArray(companies))throw new Error('companies não é array');
          const req=['Dual Clima','Madrid','OPR']; for(const n of req)if(!companies.some(c=>String(c.name)===n))throw new Error('Empresa ausente: '+n);
          const projects=await get('/api/projects'); if(!Array.isArray(projects))throw new Error('projects não é array');
          const ids=new Set(companies.map(c=>String(c.id))); const orphan=projects.filter(p=>p.company_id&&!ids.has(String(p.company_id))); if(orphan.length)throw new Error('Projetos órfãos: '+orphan.slice(0,5).map(p=>p.id+':'+p.company_id).join(','));
          for(const [token,name] of [['dualclima','Dual Clima'],['madrid','Madrid'],['opr','OPR']]){const d=await get('/api/public-client-projects?company='+token);if(!d.company||String(d.company.name)!==name)throw new Error('Tenant público incorreto: '+token);const id=String(d.company.id);if((d.projects||[]).some(p=>String(p.company_id)!==id))throw new Error('Cruzamento de tenant: '+name)}
          console.log(JSON.stringify({ok:true,environment:'stage',companies:req,projects:projects.length},null,2));
          NODE

      - name: Upload Stage backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-core-recovery-backups-20260823
          path: |
            backup-stage-before-core-recovery.sql
            backups/*.sql
          if-no-files-found: warn
          retention-days: 30

      - name: Mark Stage success
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=allamo/core-recovery-stage -f description='Stage recuperado, publicado e smoke aprovado'

      - name: Mark Stage failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=allamo/core-recovery-stage -f description='Stage falhou; Produção não será alterada'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=allamo/core-recovery -f description='Recuperação interrompida no Stage'

  production:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Mark Production pending
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=allamo/core-recovery-production -f description='Stage aprovado; recuperando Produção'

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Download same validated artifact
        uses: actions/download-artifact@v4
        with:
          name: allamo-release-public-20260823
          path: public

      - name: Prepare Cloudflare auth
        run: node sallamos-ai/scripts/prepare-cloudflare-auth.mjs

      - name: Cloudflare auth preflight
        run: npx wrangler@4.124.0 whoami

      - name: Portable Wrangler JSON parser for recovery
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/repair-core-tenants.mjs'; let s=fs.readFileSync(p,'utf8');
          const old=`    let parsed;\n    try{ parsed=JSON.parse(out); }\n    catch{ throw new Error('Wrangler retornou saída não-JSON ao consultar D1.'); }`;
          const neu=`    let parsed;\n    try{ parsed=JSON.parse(out); }\n    catch{\n      const clean=String(out||'').replace(/\\u001b\\[[0-9;?]*[ -\\/]*[@-~]/g,'').trim(); let ok=null;\n      const starts=[]; for(let i=0;i<clean.length;i++) if(clean[i]==='['||clean[i]==='{') starts.push(i);\n      const ends=[]; for(let i=clean.length-1;i>=0;i--) if(clean[i]===']'||clean[i]==='}') ends.push(i);\n      outer: for(const a of starts){ for(const b of ends){ if(b<=a) continue; try{ ok=JSON.parse(clean.slice(a,b+1)); break outer; }catch{} } }\n      if(ok===null) throw new Error('Wrangler retornou saída sem payload JSON reconhecível ao consultar D1.'); parsed=ok;\n    }`;
          if(!s.includes(old)) throw new Error('Parser esperado não encontrado'); fs.writeFileSync(p,s.replace(old,neu));
          NODE
          node scripts/validate-core-tenant-repair.mjs

      - name: Backup Production before repair
        run: npx wrangler@4.124.0 d1 export DB --remote --config wrangler.production.toml --output=backup-production-before-core-recovery.sql

      - name: Production dry-run
        run: node scripts/repair-core-tenants.mjs --env=production

      - name: Production additive apply
        run: node scripts/repair-core-tenants.mjs --env=production --apply --confirm=REPAIR-PRODUCTION

      - name: Production post-repair dry-run
        run: node scripts/repair-core-tenants.mjs --env=production

      - name: Deploy same artifact to Production
        shell: bash
        run: |
          cp wrangler.production.toml wrangler.toml
          grep -F 'name = "allamo-pmo"' wrangler.toml
          npx wrangler@4.124.0 pages deploy public --project-name allamo-pmo --branch main --commit-dirty=true

      - name: Production smoke test
        env: { BASE_URL: "https://allamo-pmo.pages.dev" }
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL,sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){let last='';for(let i=0;i<14;i++){try{const r=await fetch(base+path,{headers:{'cache-control':'no-cache'},cache:'no-store'});const t=await r.text();if(r.ok){try{return JSON.parse(t)}catch{last='JSON inválido '+t.slice(0,160)}}else last='HTTP '+r.status+' '+t.slice(0,160)}catch(e){last=String(e)}await sleep(3000)}throw new Error(path+' falhou: '+last)}
          const companies=await get('/api/companies'); if(!Array.isArray(companies))throw new Error('companies não é array');
          const req=['Dual Clima','Madrid','OPR']; for(const n of req)if(!companies.some(c=>String(c.name)===n))throw new Error('Empresa ausente: '+n);
          const projects=await get('/api/projects'); if(!Array.isArray(projects))throw new Error('projects não é array');
          const ids=new Set(companies.map(c=>String(c.id))); const orphan=projects.filter(p=>p.company_id&&!ids.has(String(p.company_id))); if(orphan.length)throw new Error('Projetos órfãos: '+orphan.slice(0,5).map(p=>p.id+':'+p.company_id).join(','));
          for(const [token,name] of [['dualclima','Dual Clima'],['madrid','Madrid'],['opr','OPR']]){const d=await get('/api/public-client-projects?company='+token);if(!d.company||String(d.company.name)!==name)throw new Error('Tenant público incorreto: '+token);const id=String(d.company.id);if((d.projects||[]).some(p=>String(p.company_id)!==id))throw new Error('Cruzamento de tenant: '+name)}
          console.log(JSON.stringify({ok:true,environment:'production',companies:req,projects:projects.length},null,2));
          NODE

      - name: Upload Production backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-core-recovery-backups-20260823
          path: |
            backup-production-before-core-recovery.sql
            backups/*.sql
          if-no-files-found: warn
          retention-days: 30

      - name: Mark Production and overall success
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=allamo/core-recovery-production -f description='Produção recuperada, publicada e smoke aprovado'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=allamo/core-recovery -f description='Stage + Produção concluídos com sucesso'

      - name: Mark Production failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=allamo/core-recovery-production -f description='Produção falhou após Stage aprovado'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=allamo/core-recovery -f description='Recuperação interrompida em Produção'
