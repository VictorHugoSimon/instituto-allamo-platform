name: Stage Live Diagnostic

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/stage-live-diagnostic.yml'

permissions:
  contents: read
  actions: read

# Revalidação final após conclusão da release bd2ebba.
jobs:
  diagnose-stage-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspecionar execução da release atual
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: bd2ebbaee5c0cc8efa4eb04bb5deada044db0d30
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=30" --jq '.workflow_runs[] | select(.name=="Release STAGE - Auto + Manual Gate") | .id' | head -n1)
          echo "RUN_ID=${RUN_ID:-nao-encontrado}"
          if [ -z "${RUN_ID:-}" ]; then exit 0; fi
          echo '=== RUN ==='
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '{id,name,event,status,conclusion,created_at,updated_at,run_attempt,html_url}'
          echo '=== JOBS / STEPS ==='
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '.jobs[] | {id,name,status,conclusion,started_at,completed_at,steps:[.steps[]|{number,name,status,conclusion}]}'

      - name: Diagnosticar URL canônica do Stage
        shell: bash
        run: |
          set +e
          BASE='https://allamo-pmo-stage.pages.dev'
          TARGET='bd2ebbaee5c0cc8efa4eb04bb5deada044db0d30'
          echo '=== release.json ==='
          curl -sS -L --max-time 20 -D /tmp/release.headers "$BASE/release.json?_diag=$(date +%s)" -o /tmp/release.body
          cat /tmp/release.headers
          cat /tmp/release.body
          echo
          echo "=== release-$TARGET.json ==="
          curl -sS -L --max-time 20 -w '\nHTTP %{http_code}\n' "$BASE/release-$TARGET.json?_diag=$(date +%s)"
          echo
          echo '=== stage-health ==='
          curl -sS -L --max-time 20 -w '\nHTTP %{http_code}\n' "$BASE/api/stage-health?_diag=$(date +%s)"
          echo
          echo '=== companies (no auth) ==='
          curl -sS -L --max-time 20 -w '\nHTTP %{http_code}\n' "$BASE/api/companies?_diag=$(date +%s)"
          echo
          echo '=== root headers ==='
          curl -sS -L --max-time 20 -I "$BASE/?_diag=$(date +%s)"
          exit 0

      - name: Smoke de governança atual
        env:
          ALLAMO_STAGE_URL: https://allamo-pmo-stage.pages.dev
        run: node scripts/smoke-governance-stage.mjs

      - name: Smoke dos tenants essenciais atual
        run: node scripts/smoke-core-tenants.mjs --base=https://allamo-pmo-stage.pages.dev --env=stage
