name: Catalog Sync Remote Dry Run

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/catalog-sync-remote-dryrun-ci.yml'
      - 'scripts/sync-stage-catalog-to-production.mjs'
      - 'scripts/sync-stage-catalog-to-production-portable.mjs'
      - 'wrangler.stage.toml'
      - 'wrangler.production.toml'

permissions:
  contents: read

jobs:
  remote-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validar contrato do sincronizador
        run: node scripts/sync-stage-catalog-to-production-portable.mjs --self-test
      - name: Preparar autenticação Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node sallamos-ai/scripts/prepare-cloudflare-auth.mjs
      - name: Confirmar autenticação
        run: npx wrangler@4.124.0 whoami
      - name: Dry-run remoto Stage → Produção sem escrita
        run: node scripts/sync-stage-catalog-to-production-portable.mjs
