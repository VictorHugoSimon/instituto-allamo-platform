name: MADRI PMO - Stage Schema + CRUD Smoke

# Operação tenant-specific: execução exclusivamente manual.
# Nunca disparar em push/merge genérico do Painel PMO, para preservar o baseline zero.
on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: madri-pmo-stage-schema
  cancel-in-progress: false

jobs:
  madri-pmo-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout do commit selecionado
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar bundle validável antes do gate MADRI
        run: npm run build:work

      - name: Validar contrato MADRI antes de qualquer alteração
        run: npm run test:madri-pmo

      - name: Confirmar que o Stage canônico está saudável antes da operação manual
        env:
          ALLAMO_STAGE_URL: https://allamo-pmo-stage.pages.dev
        run: node scripts/smoke-governance-environment.mjs --base=https://allamo-pmo-stage.pages.dev --env=stage --allow-zero=true

      - name: Preparar autenticação Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node sallamos-ai/scripts/prepare-cloudflare-auth.mjs

      - name: Backup obrigatório do D1 Stage antes do seed MADRI
        run: node scripts/secure-d1-export.mjs --config wrangler.stage.toml --output "backup-stage-before-madri-${GITHUB_SHA}.sql"

      - name: Guardar backup da operação MADRI
        uses: actions/upload-artifact@v4
        with:
          name: d1-stage-before-madri-${{ github.sha }}
          path: backup-stage-before-madri-${{ github.sha }}.sql
          if-no-files-found: error
          retention-days: 14

      - name: Dry-run do schema MADRI PMO
        run: node scripts/ensure-madri-pmo-schema.mjs --env=stage

      - name: Aplicar schema aditivo e seed de evidências no Stage
        run: node scripts/ensure-madri-pmo-schema.mjs --env=stage --apply --confirm=APPLY-MADRI-PMO-STAGE

      - name: Criar sessão técnica efêmera autenticada no Stage
        run: node scripts/prepare-stage-smoke-session.mjs

      - name: Validar CRUD real e persistência do Plano MADRI
        env:
          ALLAMO_STAGE_URL: https://allamo-pmo-stage.pages.dev
        run: node scripts/smoke-madri-pmo-stage.mjs

      - name: Expirar sessão técnica do smoke MADRI
        if: always()
        run: node scripts/expire-stage-smoke-session.mjs

      - name: Resumo
        if: always()
        run: |
          echo "### MADRI PMO · Stage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Disparo: exclusivamente manual" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: executado antes do validador de bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backup D1: obrigatório antes de qualquer seed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schema: aditivo + seed baseado em evidências" >> "$GITHUB_STEP_SUMMARY"
          echo "- Plano: work_items / pmo_scope=MADRI_NUCCI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Report: derivado do Plano Mestre" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sessão do smoke: técnica, efêmera, mascarada e exclusiva do Stage" >> "$GITHUB_STEP_SUMMARY"
          echo "- DELETE anônimo: continua bloqueado" >> "$GITHUB_STEP_SUMMARY"
