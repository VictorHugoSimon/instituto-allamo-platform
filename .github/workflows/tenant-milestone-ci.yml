name: Tenant Isolation + Milestone Evidence CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate-tenant-milestones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:work
      - run: node scripts/validate-tenant-milestones.mjs
      - run: node scripts/verify-data-persistence.mjs
