name: Report Create Official CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:work
      - run: npm run test:report-create
      - run: npm run test:report-link
      - run: npm run test:session
      - run: npm run test:tenant
