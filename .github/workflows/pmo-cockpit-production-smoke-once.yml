name: PMO Cockpit PRODUCTION Smoke Once

on:
  push:
    branches:
      - ops/pmo-cockpit-production-smoke-once
    paths:
      - 'scripts/smoke-pmo-cockpit-production.mjs'
      - '.github/workflows/pmo-cockpit-production-smoke-once.yml'

permissions:
  contents: read

concurrency:
  group: allamo-pmo-cockpit-production-smoke-once
  cancel-in-progress: false

jobs:
  cockpit-production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLAMO_PRODUCTION_URL: https://allamo-pmo.pages.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Confirmar D1 PROD em estado zero antes do smoke
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.production.toml --command "SELECT (SELECT COUNT(*) FROM companies) AS companies, (SELECT COUNT(*) FROM projects) AS projects;" --json > /tmp/pmo-prod-zero.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const raw=fs.readFileSync('/tmp/pmo-prod-zero.json','utf8');
          const a=raw.indexOf('['),b=raw.lastIndexOf(']');
          if(a<0||b<a)throw new Error('Resposta D1 sem JSON reconhecível');
          const row=JSON.parse(raw.slice(a,b+1)).flatMap(x=>x?.results||[])[0]||{};
          if(Number(row.companies)!==0||Number(row.projects)!==0)throw new Error(`Pré-condição inválida: companies=${row.companies}; projects=${row.projects}`);
          console.log('[OK] Pré-condição PROD: 0 empresas / 0 projetos.');
          NODE

      - name: Smoke autenticado do Cockpit em Produção
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(node -e "console.log(require('node:crypto').randomUUID())")"
          echo "::add-mask::$TOKEN"
          cleanup() {
            npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.production.toml --command "DELETE FROM sessions WHERE token='$TOKEN';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes wrangler@4.124.0 d1 execute DB --remote --config wrangler.production.toml --command "INSERT INTO sessions (token,user_id,expires_at) SELECT '$TOKEN',id,datetime('now','+10 minutes') FROM users WHERE role IN ('pmo','admin') AND (status IS NULL OR status <> 'Bloqueado') ORDER BY CASE role WHEN 'pmo' THEN 0 ELSE 1 END,id LIMIT 1;" >/dev/null
          ALLAMO_PMO_SMOKE_TOKEN="$TOKEN" node scripts/smoke-pmo-cockpit-production.mjs

      - name: Confirmar remoção da sessão técnica
        shell: bash
        run: |
          set -euo pipefail
          echo '[OK] Cleanup da sessão temporária executado pelo trap do smoke.'
